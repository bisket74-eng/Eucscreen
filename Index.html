<!DOCTYPE html>
<html>
<head>
    <title>EUC Rider Line Art</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #clock {
            position: absolute;
            top: 10%;
            color: white;
            font-family: 'Courier New', monospace;
            font-size: 3rem;
            border-bottom: 2px solid white;
        }

        /* The Road Line */
        .road-container {
            position: absolute;
            bottom: 30%;
            width: 100%;
            height: 200px;
        }

        .flat-road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 2px;
            background: white;
        }

        /* The Bump */
        .bump {
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 100px;
            border: 2px solid white;
            border-bottom: none;
            border-top-left-radius: 110px;
            border-top-right-radius: 110px;
            background: black;
        }

        /* EUC Rider Figure */
        .rider {
            position: absolute;
            bottom: 0;
            left: -50px;
            width: 40px;
            height: 80px;
            animation: moveRider 6s linear infinite;
        }

        /* The Wheel */
        .wheel {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 24px;
            border: 2px solid white;
            border-radius: 50%;
        }

        .wheel::before {
            content: '';
            position: absolute;
            top: 50%;
            width: 100%;
            height: 1px;
            background: white;
            animation: spin 0.4s linear infinite;
        }

        /* The Stick Figure Body */
        .body-line {
            position: absolute;
            bottom: 24px;
            left: 50%;
            width: 2px;
            height: 40px;
            background: white;
            transform-origin: bottom;
            transform: rotate(-10deg); /* Leaning into the ride */
        }

        .helmet {
            position: absolute;
            top: -15px;
            left: -8px;
            width: 18px;
            height: 14px;
            border: 2px solid white;
            border-radius: 10px 10px 2px 2px;
            background: black;
        }

        /* Movement Logic */
        @keyframes moveRider {
            0% { left: -5%; bottom: 0; transform: rotate(0deg); }
            35% { left: 40%; bottom: 0; transform: rotate(-10deg); }
            /* Going up the bump */
            45% { bottom: 85px; transform: rotate(-30deg); }
            /* Top of bump */
            50% { left: 50%; bottom: 100px; transform: rotate(0deg); }
            /* Coming down */
            55% { bottom: 85px; transform: rotate(30deg); }
            65% { left: 60%; bottom: 0; transform: rotate(10deg); }
            100% { left: 110%; bottom: 0; transform: rotate(0deg); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="clock">00:00:00</div>

    <div class="road-container">
        <div class="flat-road"></div>
        <div class="bump"></div>
        
        <div class="rider">
            <div class="body-line">
                <div class="helmet"></div>
            </div>
            <div class="wheel"></div>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const time = now.getHours().toString().padStart(2, '0') + ":" + 
                         now.getMinutes().toString().padStart(2, '0') + ":" + 
                         now.getSeconds().toString().padStart(2, '0');
            document.getElementById('clock').innerText = time;
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
