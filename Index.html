
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EUC Line Drawing</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000; /* Black Background */
            font-family: 'Courier New', monospace;
        }

        /* Minimalist White Clock */
        #clock-container {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 2.5rem;
            letter-spacing: 5px;
            border-bottom: 2px solid #fff;
            padding-bottom: 5px;
            z-index: 10;
        }

        /* The Road / Line Drawing */
        .stage {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* The white line road with a bump */
        .road {
            position: absolute;
            bottom: 20%;
            width: 200%; /* Extra width for scrolling feel */
            height: 4px;
            background: #fff;
            left: -50%;
        }

        /* The Hill/Bump */
        .hill {
            position: absolute;
            bottom: calc(20% - 10px);
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 150px;
            border: 4px solid #fff;
            border-bottom: none;
            border-radius: 150px 150px 0 0;
        }

        /* EUC Rider Container */
        .euc-rider {
            position: absolute;
            bottom: 20%;
            left: -100px;
            width: 50px;
            height: 100px;
            animation: ride 7s linear infinite;
        }

        /* The Unicycle Wheel */
        .wheel {
            position: absolute;
            bottom: 0;
            left: 10px;
            width: 30px;
            height: 30px;
            border: 2px solid #fff;
            border-radius: 50%;
            animation: spin 0.5s linear infinite;
        }
        
        .wheel::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: #fff;
        }

        /* The Rider Figure */
        .body-line {
            position: absolute;
            bottom: 30px;
            left: 20px;
            width: 4px;
            height: 45px;
            background: #fff;
            transform: rotate(-10deg); /* Leaning forward */
        }

        .helmet {
            position: absolute;
            top: -20px;
            left: -8px;
            width: 20px;
            height: 18px;
            border: 2px solid #fff;
            border-radius: 10px 10px 4px 4px;
            background: #000;
        }

        /* Animation for the journey */
        @keyframes ride {
            0% { 
                left: -10%; 
                bottom: 20%; 
                transform: rotate(0deg); 
            }
            /* Approach Hill */
            35% { 
                left: 35%; 
                bottom: 20%; 
                transform: rotate(-5deg); 
            }
            /* Up the Hill */
            45% { 
                bottom: 35%; 
                transform: rotate(-25deg); 
            }
            /* Peak */
            50% { 
                left: 50%; 
                bottom: 40%; 
                transform: rotate(0deg); 
            }
            /* Down the Hill */
            55% { 
                bottom: 35%; 
                transform: rotate(25deg); 
            }
            /* Back to flat */
            65% { 
                left: 65%; 
                bottom: 20%; 
                transform: rotate(5deg); 
            }
            100% { 
                left: 110%; 
                bottom: 20%; 
                transform: rotate(0deg); 
            }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <div id="clock-container">00:00:00</div>

    <div class="stage">
        <!-- The White Road -->
        <div class="road"></div>
        <div class="hill"></div>

        <!-- The EUC Rider -->
        <div class="euc-rider">
            <div class="body-line">
                <div class="helmet"></div>
            </div>
            <div class="wheel"></div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-GB', { 
                hour12: false, 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            });
            document.getElementById('clock-container').textContent = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
