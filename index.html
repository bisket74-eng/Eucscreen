<!DOCTYPE html>
<html>
<head>
    <title>EUC Rider - Ski Stance</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #clock {
            position: absolute;
            top: 5%;
            color: white;
            font-family: 'Arial', sans-serif;
            font-size: 4rem;
            font-weight: bold;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 600px;
        }

        .road-line {
            position: absolute;
            bottom: 50px;
            width: 100%;
            height: 6px;
            background: white;
        }

        .hill {
            position: absolute;
            bottom: 44px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 250px;
            border: 6px solid white;
            border-bottom: none;
            border-top-left-radius: 350px;
            border-top-right-radius: 350px;
            background: black;
        }

        /* EUC UNIT */
        .rider-unit {
            position: absolute;
            bottom: 50px;
            left: -200px;
            width: 120px;
            height: 280px;
            animation: eucJourney 8s linear infinite;
        }

        /* The actual Wheel (Rounded/Teardrop shape) */
        .euc-wheel-housing {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 85px;
            border: 3px solid white;
            border-radius: 30% 30% 50% 50%;
            background: black;
        }

        /* The Tire spinning inside */
        .inner-tire {
            position: absolute;
            bottom: 5px;
            left: 10px;
            width: 40px;
            height: 40px;
            border: 3px dashed white;
            border-radius: 50%;
            animation: spinTire 0.4s linear infinite;
        }

        /* Side Pedals (Footplates) */
        .pedal {
            position: absolute;
            bottom: 25px;
            width: 35px;
            height: 6px;
            background: white;
            border-radius: 2px;
        }
        .pedal.left { left: -10px; }
        .pedal.right { right: -10px; }

        /* THE RIDER (Skiing Stance) */
        .rider-body {
            position: absolute;
            bottom: 35px; /* Standing on pedals */
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 200px;
        }

        /* Tall, standing legs */
        .legs {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: space-around;
        }
        .leg-line {
            width: 8px;
            height: 100%;
            background: white;
            border-radius: 4px;
        }

        .torso {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 35px;
            height: 70px;
            border: 3px solid white;
            border-radius: 10px;
            background: black;
        }

        /* Full Face Helmet */
        .helmet {
            position: absolute;
            top: -55px;
            left: -5px;
            width: 45px;
            height: 50px;
            border: 3px solid white;
            border-radius: 50% 50% 30% 30%;
            background: black;
        }
        .visor {
            position: absolute;
            top: 12px;
            right: -4px;
            width: 25px;
            height: 12px;
            background: white;
            border-radius: 0 8px 8px 0;
        }

        /* Arms - held out slightly for balance */
        .arm {
            position: absolute;
            top: 10px;
            width: 6px;
            height: 50px;
            background: white;
        }
        .arm.left { left: -10px; transform: rotate(15deg); }
        .arm.right { right: -10px; transform: rotate(-15deg); }

        /* Animations */
        @keyframes eucJourney {
            0% { left: -15%; bottom: 50px; transform: rotate(0deg); }
            /* Lean forward to accelerate */
            30% { left: 30%; bottom: 50px; transform: rotate(-8deg); } 
            /* Up the hill */
            45% { bottom: 240px; transform: rotate(-25deg); }
            50% { left: 50%; bottom: 300px; transform: rotate(0deg); }
            /* Lean back to brake/descend */
            55% { bottom: 240px; transform: rotate(25deg); }
            70% { left: 70%; bottom: 50px; transform: rotate(5deg); }
            100% { left: 115%; bottom: 50px; transform: rotate(0deg); }
        }

        @keyframes spinTire {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="clock">00:00:00</div>

    <div class="stage">
        <div class="road-line"></div>
        <div class="hill"></div>

        <div class="rider-unit">
            <!-- EUC Device -->
            <div class="euc-wheel-housing">
                <div class="inner-tire"></div>
            </div>
            <div class="pedal left"></div>
            <div class="pedal right"></div>

            <!-- The Rider -->
            <div class="rider-body">
                <div class="legs">
                    <div class="leg-line"></div>
                    <div class="leg-line"></div>
                </div>
                <div class="torso">
                    <div class="helmet">
                        <div class="visor"></div>
                    </div>
                    <div class="arm left"></div>
                    <div class="arm right"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('en-GB');
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
