<!DOCTYPE html>
<html>
<head>
    <title>EUC Mountain Trail - Smooth Slalom</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Red 12-Hour Clock */
        #clock {
            position: absolute;
            top: 5%;
            color: #ff0000;
            font-family: 'Arial', sans-serif;
            font-size: 4rem;
            font-weight: bold;
            z-index: 100;
        }

        .mountain-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* The Winding Dirt Trail */
        .trail-path {
            position: absolute;
            width: 100%;
            height: 100%;
            fill: none;
            stroke: #3d2b1f; /* Dark brown trail */
            stroke-width: 60;
            stroke-linecap: round;
            stroke-linejoin: round;
            z-index: 1;
        }

        /* Brown Dirt Jumps */
        .mound {
            position: absolute;
            width: 140px;
            height: 35px;
            background: #8B4513; 
            border-radius: 50% 50% 0 0;
            z-index: 5;
            border-bottom: 2px solid #3d2b1f;
        }
        .m1 { top: 22%; left: 32%; transform: rotate(10deg); }
        .m2 { top: 48%; left: 55%; transform: rotate(-10deg); }
        .m3 { top: 74%; left: 32%; transform: rotate(10deg); }

        /* THE RIDER UNIT */
        .rider-unit {
            position: absolute;
            width: 100px;
            height: 180px;
            z-index: 20;
            animation: smoothSlalom 12s ease-in-out infinite;
        }

        .euc-wheel {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 55px;
            height: 55px;
            border: 4px solid white;
            border-radius: 50%;
            background: #111;
        }

        .spoke {
            position: absolute;
            top: 50%;
            width: 100%;
            height: 3px;
            background: white;
            animation: spin 0.2s linear infinite;
        }

        /* HUMAN RIDER */
        .human {
            position: absolute;
            bottom: 25px;
            width: 100%;
            height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: bottom center;
            /* Handles the knee bending logic */
            animation: kneePhysics 12s ease-in-out infinite;
        }

        .boot {
            position: absolute;
            bottom: -5px;
            width: 24px;
            height: 16px;
            background: #000;
            border: 2px solid #ff0000;
            border-radius: 4px 10px 2px 4px;
        }

        .leg-main {
            position: absolute;
            bottom: 0;
            width: 20px;
            height: 80px;
            background: #1a1a1a;
            border-radius: 4px;
        }

        .torso-main {
            position: absolute;
            bottom: 75px;
            width: 34px;
            height: 75px;
            background: #333;
            border-radius: 8px;
        }

        .backpack {
            position: absolute;
            top: 10px;
            left: -14px;
            width: 16px;
            height: 48px;
            background: #d00;
            border-radius: 4px;
            border: 1px solid white;
        }

        .strap {
            position: absolute;
            top: 10px;
            left: -2px;
            width: 38px;
            height: 5px;
            background: #d00;
        }

        .arm-main {
            position: absolute;
            top: 12px;
            right: -6px;
            width: 12px;
            height: 55px;
            background: #333;
            border-radius: 6px;
        }

        .helmet-red {
            position: absolute;
            top: -50px;
            left: -8px;
            width: 48px;
            height: 48px;
            background: #ff0000;
            border: 2px solid white;
            border-radius: 50% 50% 20% 45%;
        }

        .visor {
            position: absolute;
            top: 12px;
            right: -2px;
            width: 25px;
            height: 14px;
            background: black;
            border-radius: 0 8px 8px 0;
        }

        /* SOFTER ZIGZAG ANIMATION */
        @keyframes smoothSlalom {
            0% { top: -10%; left: 10%; transform: scaleX(1); }
            
            /* Jump 1 Arc */
            18% { top: 18%; left: 28%; } 
            22% { top: 16%; left: 35%; } /* Approach: low jump */
            26% { top: 22%; left: 45%; } 
            
            /* Smooth curve to the right */
            40% { top: 40%; left: 75%; transform: scaleX(1); }
            
            /* Pivot and Jump 2 Arc */
            44% { transform: scaleX(-1); }
            48% { top: 48%; left: 65%; }
            52% { top: 44%; left: 55%; } /* Approach: low jump */
            56% { top: 52%; left: 40%; }

            /* Smooth curve to the left */
            70% { top: 70%; left: 10%; transform: scaleX(-1); }
            
            /* Pivot and Jump 3 Arc */
            74% { transform: scaleX(1); }
            78% { top: 74%; left: 28%; }
            82% { top: 70%; left: 38%; } /* Approach: low jump */
            
            100% { top: 110%; left: 90%; transform: scaleX(1); }
        }

        /* KNEE PHYSICS - Bend on approach/climb, Straighten on jump/land */
        @keyframes kneePhysics {
            /* Cycle 1 */
            0%, 15% { transform: scaleY(1); bottom: 25px; }
            20%, 22% { transform: scaleY(0.75); bottom: 10px; } /* Crouch/Climb Jump 1 */
            26% { transform: scaleY(1); bottom: 25px; } /* Straighten in air */
            
            /* Cycle 2 */
            45%, 47% { transform: scaleY(1); bottom: 25px; }
            50%, 52% { transform: scaleY(0.75); bottom: 10px; } /* Crouch/Climb Jump 2 */
            56% { transform: scaleY(1); bottom: 25px; } /* Straighten in air */

            /* Cycle 3 */
            75%, 77% { transform: scaleY(1); bottom: 25px; }
            80%, 82% { transform: scaleY(0.75); bottom: 10px; } /* Crouch/Climb Jump 3 */
            86%, 100% { transform: scaleY(1); bottom: 25px; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="clock">12:00:00 PM</div>

    <div class="mountain-container">
        <!-- Trail Visualization -->
        <svg class="trail-path" viewBox="0 0 1000 1000" preserveAspectRatio="none">
            <path d="M 100 0 Q 300 150 400 250 T 800 500 T 200 750 T 900 1000" />
        </svg>

        <div class="mound m1"></div>
        <div class="mound m2"></div>
        <div class="mound m3"></div>

        <div class="rider-unit">
            <div class="euc-wheel"><div class="spoke"></div></div>
            <div class="human">
                <div class="leg-main"></div>
                <div class="boot"></div>
                <div class="torso-main">
                    <div class="backpack"></div>
                    <div class="strap"></div>
                    <div class="helmet-red"><div class="visor"></div></div>
                    <div class="arm-main"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            document.getElementById('clock').innerText = `${hours}:${minutes}:${seconds} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
