<!DOCTYPE html>
<html>
<head>
    <title>EUC Pro - Refined Jump</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #clock {
            position: absolute;
            top: 5%;
            color: white;
            font-family: 'Arial', sans-serif;
            font-size: 4rem;
            font-weight: bold;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 600px;
        }

        .road-line {
            position: absolute;
            bottom: 100px;
            width: 100%;
            height: 4px;
            background: white;
        }

        /* Smoother Kicker Ramp */
        .ramp {
            position: absolute;
            bottom: 100px;
            left: 42%;
            width: 180px;
            height: 80px;
            background: white;
            clip-path: polygon(0% 100%, 100% 0%, 100% 100%);
        }

        .rider-unit {
            position: absolute;
            bottom: 100px;
            left: -150px;
            width: 100px;
            height: 250px;
            animation: jumpSequence 5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* EUC WHEEL */
        .euc-wheel {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 70px;
            border: 5px solid white;
            border-radius: 50%;
            background: #111;
            z-index: 5;
        }

        .spoke {
            position: absolute;
            top: 50%;
            width: 100%;
            height: 3px;
            background: white;
            animation: spin 0.2s linear infinite;
        }

        /* HUMAN RIDER */
        .human {
            position: absolute;
            bottom: 30px;
            width: 100%;
            height: 210px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: bottom center;
            animation: riderPhysics 5s linear infinite;
        }

        /* Defined Red and Black Boots */
        .boot {
            position: absolute;
            bottom: -8px;
            width: 28px;
            height: 18px;
            background: #000;
            border: 2px solid #ff0000; /* Red accents */
            border-radius: 4px 10px 2px 4px;
            box-shadow: inset 0 -4px 0 #ff0000;
        }

        .leg-main {
            position: absolute;
            bottom: 0;
            width: 22px;
            height: 95px;
            background: #1a1a1a;
            border-radius: 4px;
            border-right: 1px solid #333;
        }

        .torso-main {
            position: absolute;
            bottom: 90px;
            width: 38px;
            height: 85px;
            background: #333;
            border-radius: 8px;
        }

        /* Defined Arm hanging at side */
        .arm-main {
            position: absolute;
            top: 10px;
            right: -8px;
            width: 14px;
            height: 65px;
            background: #333;
            border-radius: 7px;
            border-bottom: 2px solid #222; /* Forearm definition */
            transform: rotate(2deg);
        }

        .backpack {
            position: absolute;
            top: 12px;
            left: -15px;
            width: 18px;
            height: 55px;
            background: #d00;
            border-radius: 4px;
            border: 1px solid white;
        }

        .strap {
            position: absolute;
            top: 12px;
            left: -2px;
            width: 40px;
            height: 5px;
            background: #d00;
            border-radius: 2px;
        }

        .helmet-red {
            position: absolute;
            top: -55px;
            left: -8px;
            width: 52px;
            height: 52px;
            background: #ff0000;
            border: 2px solid white;
            border-radius: 50% 50% 20% 45%;
        }

        .visor {
            position: absolute;
            top: 14px;
            right: -2px;
            width: 28px;
            height: 15px;
            background: black;
            border-radius: 0 8px 8px 0;
        }

        /* ANIMATIONS */
        @keyframes jumpSequence {
            0% { left: -10%; bottom: 100px; transform: rotate(0deg); }
            30% { left: 35%; bottom: 100px; transform: rotate(0deg); }
            40% { left: 42%; bottom: 100px; transform: rotate(-22deg); } /* Incline */
            45% { left: 52%; bottom: 180px; transform: rotate(-10deg); } /* Launch */
            52% { left: 62%; bottom: 280px; transform: rotate(0deg); }  /* Smooth Peak */
            60% { left: 78%; bottom: 100px; transform: rotate(5deg); }  /* Land */
            75% { left: 95%; bottom: 100px; transform: rotate(0deg); }
            100% { left: 125%; bottom: 100px; transform: rotate(0deg); }
        }

        @keyframes riderPhysics {
            /* Pre-jump bend at 30%, Landing bend at 60% */
            0%, 25% { transform: scaleY(1); bottom: 30px; }
            30% { transform: scaleY(0.85); bottom: 15px; } /* Crouch before ramp */
            40%, 55% { transform: scaleY(1); bottom: 30px; }
            60% { transform: scaleY(0.8); bottom: 10px; }  /* Impact absorption */
            70%, 100% { transform: scaleY(1); bottom: 30px; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="clock">00:00:00</div>

    <div class="stage">
        <div class="road-line"></div>
        <div class="ramp"></div>

        <div class="rider-unit">
            <div class="euc-wheel"><div class="spoke"></div></div>

            <div class="human">
                <div class="leg-main"></div>
                <div class="boot"></div>
                <div class="torso-main">
                    <div class="backpack"></div>
                    <div class="strap"></div>
                    <div class="helmet-red"><div class="visor"></div></div>
                    <div class="arm-main"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('en-GB');
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
