<!DOCTYPE html>
<html>
<head>
    <title>EUC Pro - Jump & Landing</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #clock {
            position: absolute;
            top: 5%;
            color: white;
            font-family: 'Arial', sans-serif;
            font-size: 4rem;
            font-weight: bold;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 600px;
        }

        .road-line {
            position: absolute;
            bottom: 100px;
            width: 100%;
            height: 4px;
            background: white;
        }

        .ramp {
            position: absolute;
            bottom: 100px;
            left: 40%;
            width: 200px;
            height: 100px;
            background: white;
            clip-path: polygon(0% 100%, 100% 0%, 100% 100%);
        }

        .rider-unit {
            position: absolute;
            bottom: 100px;
            left: -150px;
            width: 100px;
            height: 250px;
            animation: jumpSequence 5s linear infinite;
        }

        /* EUC WHEEL */
        .euc-wheel {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 75px;
            height: 75px;
            border: 5px solid white;
            border-radius: 50%;
            background: #111;
            box-sizing: border-box;
            z-index: 5;
        }

        .spoke {
            position: absolute;
            top: 50%;
            width: 100%;
            height: 3px;
            background: white;
            animation: spin 0.2s linear infinite;
        }

        /* HUMAN RIDER */
        .human {
            position: absolute;
            bottom: 30px; /* Feet level with pedal/top of wheel */
            width: 100%;
            height: 200px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: kneeBend 5s linear infinite;
        }

        /* Black Boot */
        .boot {
            position: absolute;
            bottom: -5px;
            width: 24px;
            height: 15px;
            background: #000;
            border: 1px solid #333;
            border-radius: 4px 8px 2px 2px;
        }

        /* Black Pants - Straight Leg */
        .leg-main {
            position: absolute;
            bottom: 0;
            width: 20px;
            height: 90px;
            background: #1a1a1a;
            border-radius: 4px;
        }

        /* Torso - Straightened Out */
        .torso-main {
            position: absolute;
            bottom: 85px;
            width: 34px;
            height: 80px;
            background: #333;
            border-radius: 6px;
        }

        /* Red Backpack with Straps */
        .backpack {
            position: absolute;
            top: 10px;
            left: -14px;
            width: 16px;
            height: 50px;
            background: #d00;
            border-radius: 4px;
            border: 1px solid white;
        }

        .strap {
            position: absolute;
            top: 10px;
            left: 0;
            width: 34px;
            height: 4px;
            background: #d00;
            border-radius: 2px;
        }

        /* Arm Hanging at Side */
        .arm-main {
            position: absolute;
            top: 10px;
            right: -6px;
            width: 12px;
            height: 60px;
            background: #333;
            border-radius: 6px;
            transform: rotate(5deg);
        }

        /* Red Helmet */
        .helmet-red {
            position: absolute;
            top: -55px;
            left: -8px;
            width: 50px;
            height: 50px;
            background: #ff0000;
            border: 2px solid white;
            border-radius: 50% 50% 20% 45%;
        }

        .visor {
            position: absolute;
            top: 12px;
            right: -2px;
            width: 26px;
            height: 14px;
            background: black;
            border-radius: 0 8px 8px 0;
        }

        /* ANIMATIONS */
        @keyframes jumpSequence {
            0% { left: -10%; bottom: 100px; transform: rotate(0deg); }
            30% { left: 32%; bottom: 100px; transform: rotate(0deg); }
            40% { left: 40%; bottom: 100px; transform: rotate(-26deg); } /* Up Ramp */
            45% { left: 50%; bottom: 200px; transform: rotate(-15deg); }
            52% { left: 60%; bottom: 330px; transform: rotate(0deg); } /* Peak - lower height */
            60% { left: 78%; bottom: 100px; transform: rotate(5deg); } /* Landing */
            75% { left: 90%; bottom: 100px; transform: rotate(0deg); }
            100% { left: 120%; bottom: 100px; transform: rotate(0deg); }
        }

        @keyframes kneeBend {
            /* Syncing knee bend with landing at 60% mark */
            0%, 58% { transform: scaleY(1); bottom: 30px; }
            60% { transform: scaleY(0.85); bottom: 15px; } /* Squash on landing */
            65%, 100% { transform: scaleY(1); bottom: 30px; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="clock">00:00:00</div>

    <div class="stage">
        <div class="road-line"></div>
        <div class="ramp"></div>

        <div class="rider-unit">
            <div class="euc-wheel"><div class="spoke"></div></div>

            <div class="human">
                <div class="leg-main"></div>
                <div class="boot"></div>
                <div class="torso-main">
                    <div class="backpack"></div>
                    <div class="strap"></div>
                    <div class="helmet-red"><div class="visor"></div></div>
                    <div class="arm-main"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('en-GB');
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
