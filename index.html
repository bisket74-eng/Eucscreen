<!DOCTYPE html>
<html>
<head>
    <title>NWEF EUC - Pro Rider Build</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Arial', sans-serif; }

        /* --- THE FOREST (Fixed Silhouette) --- */
        .forest-bg {
            position: absolute;
            bottom: 20px;
            width: 100%;
            height: 600px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M10 100 L25 10 L40 100 Z M40 100 L55 20 L70 100 Z M70 100 L85 15 L100 100 Z M0 100 L10 40 L20 100 Z" fill="%23111"/></svg>');
            background-size: 400px 100%;
            background-repeat: repeat-x;
            background-position: bottom;
            z-index: 1;
            opacity: 0.9;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.1));
        }

        /* --- DASHBOARD --- */
        #hud { position: absolute; top: 5%; display: flex; align-items: center; justify-content: space-between; width: 92%; z-index: 100; }
        #clock { color: #bc13fe; font-size: 3rem; font-weight: 900; text-shadow: 0 0 15px #bc13fe; font-family: monospace; }
        #nwef { font-size: 14rem; font-weight: 900; background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff, #ff0000); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: rainbow 3s linear infinite; margin: 0; }
        #t-minus { color: #ff9100; font-size: 2rem; font-weight: 900; text-align: right; text-shadow: 0 0 10px #ff9100; }
        @keyframes rainbow { to { background-position: 200% center; } }

        /* --- STAGE --- */
        .stage { position: relative; width: 100%; height: 100vh; z-index: 10; }
        .road { position: absolute; bottom: 20px; width: 100%; height: 6px; background: #222; z-index: 10; }
        .mound { 
            position: absolute; bottom: 20px; left: 40%; width: 300px; height: 35px; background: #5d4037; 
            clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%); z-index: 11;
        }

        /* --- THE RIDER UNIT --- */
        .rider-unit {
            position: absolute; bottom: 20px; left: -300px;
            width: 200px; height: 350px; z-index: 50;
            animation: moveLoop 7s linear infinite;
        }

        /* Begode/King Song Shell */
        .euc-shell { 
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); 
            width: 85px; height: 100px; background: #1a1a1a; border-radius: 15px; 
            border-left: 5px solid #ff0000; z-index: 20; 
        }
        .tire { 
            position: absolute; bottom: -5px; left: 5px; width: 85px; height: 85px; 
            background: #000; border-radius: 50%; border: 4px solid #333; z-index: 15; 
        }

        /* HUMAN (Layered on top of Wheel) */
        .human {
            position: absolute; bottom: 35px; width: 100%; height: 280px;
            z-index: 60; display: flex; flex-direction: column; align-items: center;
            transform: rotate(10deg); transform-origin: bottom center;
        }

        /* Legs & Jeans */
        .leg {
            position: absolute; bottom: 0; width: 32px; height: 100px;
            background: #2b4b7c; /* Denim Blue Jeans */
            border-radius: 10px;
        }
        .knee-pad {
            position: absolute; top: 40px; left: -2px; width: 36px; height: 25px;
            background: #111; border-radius: 8px; border: 1px solid #444;
        }
        .foot-boot {
            position: absolute; bottom: -8px; left: -10px; width: 55px; height: 24px;
            background: #000; border-radius: 4px 15px 3px 5px; border: 1px solid #333;
        }

        .torso { position: absolute; bottom: 95px; width: 42px; height: 115px; background: #ddd; border-radius: 20px; }

        /* Straight Arm & Flashlight */
        .arm-straight {
            position: absolute; top: 15px; right: -15px;
            width: 18px; height: 80px; background: #ddd; border-radius: 9px;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
        }
        .flashlight {
            width: 30px; height: 12px; background: #333; border-radius: 3px;
            margin-bottom: -5px; transform: rotate(15deg);
        }
        .beam {
            position: absolute; top: 85%; left: 20px; width: 300px; height: 80px;
            background: radial-gradient(ellipse at left, rgba(255,255,200,0.3) 0%, transparent 80%);
        }

        /* Red Motocross Helmet */
        .helmet-red {
            position: absolute; top: -55px; width: 52px; height: 50px;
            background: #ff0000; border: 2px solid white; border-radius: 45%;
        }
        .visor { position: absolute; top: 10px; right: -8px; width: 15px; height: 4px; background: #000; }

        /* --- FENCE POLES --- */
        .pole { position: absolute; bottom: 20px; width: 6px; height: 260px; background: #222; z-index: 5; }

        /* --- ANIMATIONS --- */
        @keyframes moveLoop {
            0% { left: -25%; bottom: 20px; }
            35% { left: 30%; bottom: 20px; }
            45% { left: 45%; bottom: 80px; } /* Climb mound */
            55% { left: 55%; bottom: 160px; } /* Jump */
            65% { left: 75%; bottom: 20px; } /* Land */
            100% { left: 115%; bottom: 20px; }
        }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="hud">
        <div id="clock">00:00:00 AM</div>
        <h1 id="nwef">NWEF</h1>
        <div id="t-minus">T-MINUS<br>-- DAYS<br>--:--:--</div>
    </div>

    <div class="forest-bg"></div>

    <div class="stage">
        <div id="fence-layer"></div>
        <div class="road"></div>
        <div class="mound"></div>

        <div class="rider-unit">
            <!-- Wheel/Shell Base -->
            <div class="euc-shell"></div>
            <div class="tire">
                <div style="position:absolute;top:50%;left:50%;width:45px;height:45px;border:4px solid #fff;border-radius:50%;transform:translate(-50%,-50%);">
                    <div style="position:absolute;top:50%;width:100%;height:2px;background:#fff;animation:spin 0.1s linear infinite;"></div>
                </div>
            </div>

            <!-- Human Top Layer -->
            <div class="human">
                <div class="leg">
                    <div class="knee-pad"></div>
                    <div class="foot-boot"></div>
                </div>
                <div class="torso">
                    <div class="arm-straight">
                        <div class="flashlight">
                            <div class="beam"></div>
                        </div>
                    </div>
                    <div class="helmet-red">
                        <div class="visor"></div>
                        <div style="position:absolute; top:20px; right:0; width:10px; height:10px; background:#111; border-radius:2px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Update Time & Countdown
        const target = new Date("July 15, 2026 00:00:00").getTime();
        function updateHUD() {
            const now = new Date();
            let h = now.getHours();
            const am = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            document.getElementById('clock').innerText = `${String(h).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')} ${am}`;
            
            const diff = target - now.getTime();
            const d = Math.floor(diff / 864e5), hh = Math.floor((diff % 864e5) / 36e5), mm = Math.floor((diff % 36e5) / 6e4), ss = Math.floor((diff % 6e4) / 1e3);
            document.getElementById('t-minus').innerHTML = `T-MINUS<br>${d} DAYS<br>${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
        }
        setInterval(updateHUD, 1000); updateHUD();

        // Fence Logic (Reduced to 4 poles)
        const fLayer = document.getElementById('fence-layer'), count = 4, space = window.innerWidth / (count - 1);
        for (let i = 0; i < count; i++) {
            const p = document.createElement('div'); p.className = 'pole'; p.style.left = `${i * space}px`; fLayer.appendChild(p);
            if (i < count - 1) {
                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                svg.setAttribute('style', `position:absolute;bottom:300px;left:${i*space}px;width:${space}px;height:100px;overflow:visible;`);
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute('d', `M 0 0 Q ${space/2} 80 ${space} 0`); path.setAttribute('stroke', '#333'); path.setAttribute('fill', 'none'); svg.appendChild(path);
                fLayer.appendChild(svg);
            }
        }
    </script>
</body>
</html>
