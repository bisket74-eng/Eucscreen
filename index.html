<!DOCTYPE html>
<html>
<head>
    <title>NWEF EUC - Pro Anatomy & Moonlit Forest</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Segoe UI', sans-serif; }

        /* --- MOONLIT EVERGREEN FOREST --- */
        .forest-backdrop {
            position: absolute;
            bottom: 20px; /* Grounded to road */
            width: 100%; height: 500px;
            /* Improved Evergreen Silhouette with Moonlight Rim */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" preserveAspectRatio="none"><path d="M50 5 L62 35 L54 35 L72 65 L58 65 L88 105 L12 105 L42 65 L28 65 L46 35 L38 35 Z" fill="%23050505" stroke="%23ffffff" stroke-width="0.3" opacity="0.9"/></svg>');
            background-size: 200px 100%; 
            background-repeat: repeat-x; 
            background-position: bottom;
            z-index: 0;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.15));
        }

        /* --- DASHBOARD --- */
        #dashboard { position: absolute; top: 5%; display: flex; align-items: center; justify-content: space-between; width: 92%; z-index: 50; }
        #clock { color: #bc13fe; font-size: 3.5rem; font-weight: 900; text-shadow: 0 0 20px #bc13fe; font-family: monospace; }
        #nwef { font-size: 16rem; font-weight: 900; background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff, #ff0000); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: rainbowWave 3s linear infinite; }
        #countdown { color: #ff9100; font-size: 2.2rem; font-weight: 900; text-align: right; text-shadow: 0 0 15px #ff9100; line-height: 1.1; }
        @keyframes rainbowWave { to { background-position: 200% center; } }

        /* --- STAGE --- */
        .stage { position: relative; width: 100%; height: 600px; z-index: 1; }
        .road-line { position: absolute; bottom: 20px; width: 100%; height: 6px; background: #222; z-index: 5; }

        .mound {
            position: absolute; bottom: 20px; width: 450px; height: 35px; background: #4e342e;
            clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%); left: 35%; z-index: 6;
            background-image: linear-gradient(to right, transparent, rgba(255,255,200,0.6), transparent);
            background-size: 200px 100%; background-repeat: no-repeat; background-position: -200px 0;
            animation: spotlightPass 7s linear infinite;
        }
        @keyframes spotlightPass { 0%, 35% { background-position: -200px 0; } 40%, 55% { background-position: 550px 0; } 60%, 100% { background-position: 550px 0; } }

        /* --- RIDER UNIT --- */
        .rider-unit {
            position: absolute; bottom: 20px; left: -300px;
            width: 200px; height: 350px; z-index: 20;
            animation: proJump 7s linear infinite;
        }

        .euc-body { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 110px; height: 130px; z-index: 10; }
        .tire { position: absolute; bottom: 0; left: 10px; width: 95px; height: 95px; background: #111; border: 5px solid #333; border-radius: 50%; }
        .shell { position: absolute; top: 0; left: 22px; width: 70px; height: 90px; background: #222; border-radius: 15px; border-left: 5px solid #ff0000; }

        /* HUMAN LAYER */
        .human {
            position: absolute; bottom: 45px; width: 100%; height: 300px;
            z-index: 30; display: flex; flex-direction: column; align-items: center;
            transform: rotate(15deg); transform-origin: bottom center;
            animation: suspension 7s linear infinite;
        }

        .leg-full { position: absolute; bottom: 0; width: 32px; height: 110px; }
        .thigh { position: absolute; top: 0; width: 32px; height: 65px; background: #1a1a1a; border-radius: 15px; }
        .calf { position: absolute; top: 55px; left: 4px; width: 24px; height: 50px; background: #1a1a1a; border-radius: 5px; }
        .boot { position: absolute; bottom: -5px; left: -10px; width: 55px; height: 26px; background: #000; border: 1px solid #444; border-radius: 4px 15px 3px 5px; box-shadow: inset 0 0 5px #ff0000; }

        .torso-box { position: absolute; bottom: 110px; width: 42px; height: 130px; background: #fff; border-radius: 20px; }
        
        /* IMPROVED ARM ANATOMY */
        .arm-group { position: absolute; top: 15px; right: -20px; width: 80px; height: 100px; }
        .upper { position: absolute; top: 0; right: 30px; width: 20px; height: 55px; background: #fff; border-radius: 10px; transform: rotate(-5deg); }
        .fore { position: absolute; top: 40px; right: -10px; width: 18px; height: 60px; background: #fff; border-radius: 9px; transform: rotate(50deg); border: 1px solid #ddd; }
        
        .hand-point { position: absolute; bottom: -5px; right: -10px; width: 18px; height: 18px; background: #fff; border-radius: 50%; }
        .flashlight-fixed { position: absolute; bottom: -12px; right: -25px; width: 32px; height: 14px; background: #333; border-radius: 3px; transform: rotate(-8deg); }
        .light-beam { position: absolute; top: 50%; left: 28px; width: 350px; height: 110px; background: radial-gradient(ellipse at left, rgba(255,255,200,0.4) 0%, transparent 80%); transform: translateY(-50%); }

        .mtb-helmet {
            position: absolute; top: -55px; left: -2px; width: 52px; height: 50px;
            background: #ff0000; border: 2px solid white; border-radius: 45%;
        }
        .chin-line { position: absolute; bottom: 8px; right: -3px; width: 18px; height: 4px; background: #ff0000; border: 1px solid white; }
        .visor-pro { position: absolute; top: 10px; right: -8px; width: 15px; height: 3px; background: #111; }

        .pole { position: absolute; bottom: 20px; width: 6px; height: 260px; background: #222; }

        @keyframes proJump {
            0% { left: -25%; bottom: 20px; }
            35% { left: 30%; bottom: 18px; }
            40% { left: 45%; bottom: 80px; } 
            50% { left: 55%; bottom: 170px; } 
            60% { left: 85%; bottom: 20px; } 
            100% { left: 120%; bottom: 20px; }
        }

        @keyframes suspension {
            0%, 30% { transform: scaleY(1) translateY(0) rotate(15deg); }
            35% { transform: scaleY(0.55) translateY(40px) rotate(15deg); } 
            40%, 55% { transform: scaleY(1.1) translateY(-10px) rotate(15deg); } 
            60% { transform: scaleY(0.6) translateY(40px) rotate(20deg); } 
            66% { transform: scaleY(1) translateY(0) rotate(15deg); }
        }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="dashboard">
        <div id="clock">00:00:00 AM</div>
        <h1 id="nwef">NWEF</h1>
        <div id="countdown">T-MINUS<br>-- DAYS<br>--:--:--</div>
    </div>

    <div class="forest-backdrop"></div>

    <div class="stage">
        <div id="fence-layer"></div>
        <div class="road-line"></div>
        <div class="mound"></div>

        <div class="rider-unit">
            <div class="euc-body">
                <div class="shell"></div>
                <div class="tire">
                    <div style="position:absolute;top:50%;left:50%;width:40px;height:40px;border:4px solid #fff;border-radius:50%;transform:translate(-50%,-50%);">
                        <div style="position:absolute;top:50%;width:100%;height:3px;background:#fff;animation:spin 0.1s linear infinite;"></div>
                    </div>
                </div>
            </div>

            <div class="human">
                <div class="leg-full">
                    <div class="thigh"></div>
                    <div class="calf"></div>
                    <div class="boot"></div>
                </div>
                <div class="torso-box">
                    <div class="arm-group">
                        <div class="upper"></div>
                        <div class="fore">
                            <div class="hand-point"></div>
                            <div class="flashlight-fixed"><div class="light-beam"></div></div>
                        </div>
                    </div>
                    <div class="mtb-helmet">
                        <div class="chin-line"></div>
                        <div class="visor-pro"></div>
                        <div style="position:absolute; top:20px; right:0; width:10px; height:10px; background:#111; border-radius:2px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const targetDate = new Date("July 15, 2026 00:00:00").getTime();
        function updateUI() {
            const now = new Date();
            let h = now.getHours();
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            document.getElementById('clock').innerText = `${String(h).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')} ${ampm}`;

            const diff = targetDate - now.getTime();
            const d = Math.floor(diff / 864e5), hh = Math.floor((diff % 864e5) / 36e5), mm = Math.floor((diff % 36e5) / 6e4), ss = Math.floor((diff % 6e4) / 1e3);
            document.getElementById('countdown').innerHTML = `T-MINUS<br>${d} DAYS<br>${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
        }
        setInterval(updateUI, 1000); updateUI();

        const layer = document.getElementById('fence-layer'), count = 5, space = window.innerWidth / (count - 1);
        for (let i = 0; i < count; i++) {
            const p = document.createElement('div'); p.className = 'pole'; p.style.left = `${i * space}px`; layer.appendChild(p);
            if (i < count - 1) {
                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                svg.setAttribute('style', `position:absolute;bottom:280px;left:${i*space}px;width:${space}px;height:100px;overflow:visible;`);
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute('d', `M 0 0 Q ${space/2} 80 ${space} 0`); path.setAttribute('stroke', '#333'); path.setAttribute('fill', 'none'); svg.appendChild(path);
                for (let j = 1; j < 8; j++) {
                    const t = j / 8, bx = t * space, by = (1-t)*(1-t)*0 + 2*(1-t)*t*80 + t*t*0;
                    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    c.setAttribute('cx', bx); c.setAttribute('cy', by); c.setAttribute('r', '3'); c.setAttribute('fill', '#fff');
                    c.style.animation = `twinkle ${1+Math.random()}s infinite`; svg.appendChild(c);
                }
                layer.appendChild(svg);
            }
        }
    </script>
    <style>@keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; fill: #ff0000; } }</style>
</body>
</html>
