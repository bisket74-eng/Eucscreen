<!DOCTYPE html>
<html>
<head>
    <title>EUC Motocross - Custom LEDs</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        /* --- HEADER & RAINBOW WAVE --- */
        #header-container {
            position: absolute;
            top: 8%;
            text-align: center;
            z-index: 20;
            width: 100%;
        }

        #nwef {
            font-size: 10rem;
            font-weight: 900;
            margin: 0;
            line-height: 0.8;
            letter-spacing: -2px;
            text-transform: uppercase;
            background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff, #ff0000);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowWave 3s linear infinite;
        }

        @keyframes rainbowWave { to { background-position: 200% center; } }

        #countdown { color: #fff; font-size: 1.8rem; font-weight: bold; margin-top: 15px; }
        #clock { position: absolute; top: 2%; color: #ff0000; font-size: 2.5rem; font-weight: bold; z-index: 20; }

        .stage { position: relative; width: 100%; height: 600px; }

        /* --- SINGLE DIRT MOUND --- */
        .mound {
            position: absolute;
            bottom: 100px;
            width: 200px;
            height: 45px;
            background: #5d4037;
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
            left: 40%;
            z-index: 2;
        }

        .road-line {
            position: absolute;
            bottom: 100px;
            width: 100%;
            height: 4px;
            background: white;
            z-index: 2;
        }

        /* --- RIDER & EUC UNIT --- */
        .rider-unit {
            position: absolute;
            bottom: 100px;
            left: -200px;
            width: 120px;
            height: 250px;
            z-index: 10;
            animation: singleJump 5s linear infinite;
        }

        /* Begode / King Song Style EUC */
        .euc-body {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 90px;
            z-index: 6;
        }

        .tire {
            position: absolute;
            bottom: 0;
            left: 5px;
            width: 70px;
            height: 70px;
            background: #111;
            border: 4px solid #333;
            border-radius: 50%;
        }

        .rim {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 42px;
            height: 42px;
            border: 4px solid #fff;
            border-radius: 50%;
        }

        .shell {
            position: absolute;
            top: 0;
            left: 15px;
            width: 50px;
            height: 60px;
            background: #222;
            border-radius: 10px 10px 5px 5px;
            border-left: 3px solid #ff0000;
        }

        /* --- HELMET & GEAR LEDS --- */
        .gear-led {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            filter: blur(1px);
            animation: gearTwinkle var(--speed) ease-in-out infinite;
        }

        @keyframes gearTwinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .human {
            position: absolute;
            bottom: 60px;
            width: 100%;
            height: 180px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: rotate(15deg);
            transform-origin: bottom center;
            animation: riderPhysics 5s linear infinite;
        }

        .thigh { position: absolute; bottom: 0; width: 22px; height: 50px; background: #1a1a1a; border-radius: 10px; }
        .mx-boot { position: absolute; bottom: -10px; left: -2px; width: 35px; height: 18px; background: #000; border: 1px solid #444; border-radius: 4px 10px 2px 4px; }

        .jersey {
            position: absolute;
            bottom: 45px;
            width: 32px;
            height: 80px;
            background: #fff;
            border-radius: 15px 15px 8px 8px;
        }

        .arm-side {
            position: absolute;
            top: 15px;
            right: -10px;
            width: 16px;
            height: 60px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 8px;
            transform: rotate(-5deg);
        }

        .mx-helmet {
            position: absolute;
            top: -50px;
            left: -5px;
            width: 48px;
            height: 48px;
            background: #ff0000;
            border-radius: 50% 50% 30% 30%;
            border: 2px solid white;
        }

        .mx-peak {
            position: absolute;
            top: 8px;
            right: -10px;
            width: 20px;
            height: 4px;
            background: #ff0000;
            border: 1px solid white;
            border-radius: 0 10px 10px 0;
        }

        .face-mask-tiny {
            position: absolute;
            top: 20px;
            right: 0;
            width: 18px;
            height: 8px;
            background: #111;
            border-radius: 0 4px 4px 0;
        }

        /* --- FENCE LEDS --- */
        .pole { position: absolute; bottom: 100px; width: 4px; height: 220px; background: #222; }
        .led { fill: #fff; animation: twinkle var(--speed) ease-in-out infinite; animation-delay: var(--delay); }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; fill: #ff0000; } }

        /* --- ANIMATIONS --- */
        @keyframes singleJump {
            0% { left: -20%; bottom: 100px; }
            35% { left: 38%; bottom: 100px; }
            40% { left: 45%; bottom: 145px; }
            50% { left: 50%; bottom: 260px; }
            60% { left: 55%; bottom: 100px; }
            100% { left: 110%; bottom: 100px; }
        }

        @keyframes riderPhysics {
            0%, 58% { transform: scaleY(1) rotate(15deg); }
            60% { transform: scaleY(0.8) rotate(20deg); }
            65%, 100% { transform: scaleY(1) rotate(15deg); }
        }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="clock">00:00:00 PM</div>

    <div id="header-container">
        <h1 id="nwef">NWEF</h1>
        <div id="countdown">Loading...</div>
    </div>

    <div class="stage">
        <div id="fence-layer"></div>
        <div class="road-line"></div>
        <div class="mound"></div>

        <div class="rider-unit">
            <!-- EUC with Body LEDs -->
            <div class="euc-body">
                <div class="shell">
                    <div class="gear-led" style="top:10px; left:5px; background:cyan; --speed:1.2s;"></div>
                    <div class="gear-led" style="top:25px; left:5px; background:magenta; --speed:0.8s;"></div>
                    <div class="gear-led" style="top:40px; left:5px; background:lime; --speed:1.5s;"></div>
                </div>
                <div class="tire">
                    <div class="rim">
                         <div style="position:absolute;top:50%;width:100%;height:2px;background:#fff;animation:spin 0.2s linear infinite;"></div>
                    </div>
                </div>
            </div>

            <!-- Rider with Helmet LEDs -->
            <div class="human">
                <div style="position:absolute;bottom:0;width:30px;height:60px;">
                    <div class="thigh"></div>
                    <div class="mx-boot"></div>
                </div>
                <div class="jersey">
                    <div class="arm-side"></div>
                    <div class="mx-helmet">
                        <!-- Helmet LEDs -->
                        <div class="gear-led" style="top:5px; left:10px; background:yellow; --speed:1s;"></div>
                        <div class="gear-led" style="top:5px; left:30px; background:orange; --speed:1.3s;"></div>
                        
                        <div class="mx-peak"></div>
                        <div class="face-mask-tiny"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const targetDate = new Date("July 15, 2026 00:00:00").getTime();
        function updateUI() {
            const now = new Date();
            let h = now.getHours();
            const m = String(now.getMinutes()).padStart(2, '0'), s = String(now.getSeconds()).padStart(2, '0');
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            document.getElementById('clock').innerText = `${h}:${m}:${s} ${ampm}`;
            const diff = targetDate - now.getTime();
            const d = Math.floor(diff / 864e5), hh = Math.floor((diff % 864e5) / 36e5), mm = Math.floor((diff % 36e5) / 6e4), ss = Math.floor((diff % 6e4) / 1e3);
            document.getElementById('countdown').innerText = `${d} Days | ${hh}h ${mm}m ${ss}s until July 15th, 2026`;
        }
        setInterval(updateUI, 1000); updateUI();

        const layer = document.getElementById('fence-layer'), count = 10, space = window.innerWidth / (count - 1);
        for (let i = 0; i < count; i++) {
            const p = document.createElement('div'); p.className = 'pole'; p.style.left = `${i * space}px`; layer.appendChild(p);
            if (i < count - 1) {
                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                svg.setAttribute('style', `position:absolute;bottom:280px;left:${i*space}px;width:${space}px;height:50px;overflow:visible;`);
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute('d', `M 0 0 Q ${space/2} 30 ${space} 0`); path.setAttribute('stroke', '#333'); path.setAttribute('fill', 'none'); svg.appendChild(path);
                for (let j = 1; j < 6; j++) {
                    const t = j / 6, bx = t * space, by = (1-t)*(1-t)*0 + 2*(1-t)*t*30 + t*t*0;
                    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    c.setAttribute('class', 'led'); c.setAttribute('cx', bx); c.setAttribute('cy', by); c.setAttribute('r', '2.5');
                    c.style.setProperty('--delay', `${Math.random()*2}s`); c.style.setProperty('--speed', `${1+Math.random()}s`); svg.appendChild(c);
                }
                layer.appendChild(svg);
            }
        }
    </script>
</body>
</html>
