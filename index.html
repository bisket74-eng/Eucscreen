<!DOCTYPE html>
<html>
<head>
    <title>EUC Mountain Trail - Precision Slalom</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #clock {
            position: absolute;
            top: 5%;
            color: #ff0000;
            font-family: 'Arial', sans-serif;
            font-size: 4rem;
            font-weight: bold;
            z-index: 100;
        }

        .mountain-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* The Winding Dirt Trail - Centered to Animation */
        .trail-path {
            position: absolute;
            width: 100%;
            height: 100%;
            fill: none;
            stroke: #3d2b1f; 
            stroke-width: 80;
            stroke-linecap: round;
            stroke-linejoin: round;
            z-index: 1;
        }

        /* Brown Dirt Jumps - Centered on Path */
        .mound {
            position: absolute;
            width: 160px;
            height: 40px;
            background: #8B4513; 
            border-radius: 50% 50% 0 0;
            z-index: 5;
            transform: translateX(-50%); /* Ensures left % is the center of the mound */
        }
        .m1 { top: 20%; left: 30%; }
        .m2 { top: 50%; left: 70%; }
        .m3 { top: 80%; left: 30%; }

        .rider-unit {
            position: absolute;
            width: 100px;
            height: 180px;
            z-index: 20;
            transform: translateX(-50%);
            /* Using a smoother bezier for the 'carving' feel */
            animation: precisionSlalom 12s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        }

        .euc-wheel {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 55px;
            height: 55px;
            border: 4px solid white;
            border-radius: 50%;
            background: #111;
        }

        .spoke {
            position: absolute;
            top: 50%;
            width: 100%;
            height: 3px;
            background: white;
            animation: spin 0.2s linear infinite;
        }

        .human {
            position: absolute;
            bottom: 25px;
            width: 100%;
            height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: bottom center;
            animation: kneePhysics 12s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        }

        .boot {
            position: absolute;
            bottom: -5px;
            width: 24px;
            height: 16px;
            background: #000;
            border: 2px solid #ff0000;
            border-radius: 4px 10px 2px 4px;
        }

        .leg-main {
            position: absolute;
            bottom: 0;
            width: 20px;
            height: 80px;
            background: #1a1a1a;
            border-radius: 4px;
        }

        .torso-main {
            position: absolute;
            bottom: 75px;
            width: 34px;
            height: 75px;
            background: #333;
            border-radius: 6px;
        }

        .backpack {
            position: absolute;
            top: 10px;
            left: -14px;
            width: 16px;
            height: 48px;
            background: #d00;
            border-radius: 4px;
            border: 1px solid white;
        }

        .strap {
            position: absolute;
            top: 10px;
            left: -2px;
            width: 38px;
            height: 5px;
            background: #d00;
        }

        .arm-main {
            position: absolute;
            top: 12px;
            right: -6px;
            width: 12px;
            height: 55px;
            background: #333;
            border-radius: 6px;
        }

        .helmet-red {
            position: absolute;
            top: -50px;
            left: -8px;
            width: 48px;
            height: 48px;
            background: #ff0000;
            border: 2px solid white;
            border-radius: 50% 50% 20% 45%;
        }

        .visor {
            position: absolute;
            top: 12px;
            right: -2px;
            width: 25px;
            height: 14px;
            background: black;
            border-radius: 0 8px 8px 0;
        }

        /* PRECISION SLALOM WITH SMOOTH TURNS */
        @keyframes precisionSlalom {
            0%   { top: -10%; left: 30%; transform: translateX(-50%) scaleX(1); }
            
            /* Jump 1 */
            18%  { top: 18%; left: 30%; } 
            22%  { top: 12%; left: 30%; } /* Hop over mound 1 */
            26%  { top: 22%; left: 30%; } 
            
            /* Smooth carve to Right Turn */
            35%  { top: 35%; left: 50%; transform: translateX(-50%) scaleX(1); } 
            40%  { top: 50%; left: 70%; transform: translateX(-50%) scaleX(1); } /* Approach Jump 2 */
            
            /* Smooth 3D-ish Pivot */
            41%  { transform: translateX(-50%) scaleX(0.1); } /* Mid-turn compression */
            42%  { transform: translateX(-50%) scaleX(-1); } /* Face Left */

            /* Jump 2 */
            48%  { top: 50%; left: 70%; }
            52%  { top: 42%; left: 70%; } /* Hop over mound 2 */
            56%  { top: 55%; left: 70%; }

            /* Smooth carve back to Left Turn */
            65%  { top: 65%; left: 50%; transform: translateX(-50%) scaleX(-1); }
            70%  { top: 80%; left: 30%; transform: translateX(-50%) scaleX(-1); } /* Approach Jump 3 */
            
            /* Smooth 3D-ish Pivot */
            71%  { transform: translateX(-50%) scaleX(-0.1); }
            72%  { transform: translateX(-50%) scaleX(1); } /* Face Right */

            /* Jump 3 */
            78%  { top: 80%; left: 30%; }
            82%  { top: 72%; left: 30%; } /* Hop over mound 3 */
            86%  { top: 88%; left: 30%; }
            
            100% { top: 110%; left: 50%; transform: translateX(-50%) scaleX(1); }
        }

        @keyframes kneePhysics {
            /* Synchronized with Jump 1 */
            18%, 20% { transform: scaleY(0.75); bottom: 10px; } 
            26%      { transform: scaleY(1); bottom: 25px; } 
            
            /* Synchronized with Jump 2 */
            48%, 50% { transform: scaleY(0.75); bottom: 10px; } 
            56%      { transform: scaleY(1); bottom: 25px; } 

            /* Synchronized with Jump 3 */
            78%, 80% { transform: scaleY(0.75); bottom: 10px; } 
            86%      { transform: scaleY(1); bottom: 25px; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="clock">12:00:00 PM</div>

    <div class="mountain-container">
        <!-- SVG Trail precisely following the animation keypoints (30% -> 70% -> 30%) -->
        <svg class="trail-path" viewBox="0 0 100 100" preserveAspectRatio="none">
            <path d="M 30 -10 L 30 25 L 70 55 L 30 85 L 50 110" />
        </svg>

        <div class="mound m1"></div>
        <div class="mound m2"></div>
        <div class="mound m3"></div>

        <div class="rider-unit">
            <div class="euc-wheel"><div class="spoke"></div></div>
            <div class="human">
                <div class="leg-main"></div>
                <div class="boot"></div>
                <div class="torso-main">
                    <div class="backpack"></div>
                    <div class="strap"></div>
                    <div class="helmet-red"><div class="visor"></div></div>
                    <div class="arm-main"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            document.getElementById('clock').innerText = `${hours}:${minutes}:${seconds} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
