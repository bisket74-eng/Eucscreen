<!DOCTYPE html>
<html>
<head>
    <title>EUC Pro Rider</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Large Minimalist Clock */
        #clock {
            position: absolute;
            top: 5%;
            color: white;
            font-family: 'Arial', sans-serif;
            font-size: 4rem;
            font-weight: bold;
            letter-spacing: 4px;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 600px;
            display: flex;
            align-items: flex-end;
        }

        /* Thicker, bolder road */
        .road-line {
            position: absolute;
            bottom: 50px;
            width: 100%;
            height: 8px;
            background: white;
        }

        /* Larger Hill */
        .hill {
            position: absolute;
            bottom: 42px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 250px;
            border: 8px solid white;
            border-bottom: none;
            border-top-left-radius: 300px;
            border-top-right-radius: 300px;
            background: black;
        }

        /* THE RIDER CONTAINER */
        .rider-unit {
            position: absolute;
            bottom: 50px;
            left: -200px;
            width: 150px;
            height: 250px;
            animation: proRide 8s linear infinite;
            z-index: 10;
        }

        /* The Electric Unicycle (No pedals, just the body/tire) */
        .euc-body {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 90px;
            border: 4px solid white;
            border-radius: 20px;
            background: black;
        }

        .tire {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            border: 5px solid white;
            border-radius: 50%;
        }

        .tire::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 100%;
            height: 4px;
            background: white;
            animation: spin 0.3s linear infinite;
        }

        /* The Person */
        .person {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 140px;
        }

        /* Full Motorcycle Helmet & Head */
        .helmet-head {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 45px;
            height: 50px;
            border: 3px solid white;
            border-radius: 50% 50% 40% 40%;
            background: black;
        }

        .visor {
            position: absolute;
            top: 10px;
            right: -5px;
            width: 30px;
            height: 15px;
            background: white;
            border-radius: 0 10px 10px 0;
        }

        /* Torso and Gear */
        .torso {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 55px;
            border: 3px solid white;
            border-radius: 10px;
            background: black;
        }

        /* Arms with Elbow Pads */
        .arm {
            position: absolute;
            top: 55px;
            width: 8px;
            height: 45px;
            background: white;
            transform: rotate(-20deg);
        }
        .arm.front { right: -10px; }
        .elbow-pad {
            position: absolute;
            top: 20px;
            left: -4px;
            width: 15px;
            height: 15px;
            border: 2px solid black;
            background: white;
            border-radius: 4px;
        }

        /* Legs with Knee Pads */
        .leg {
            position: absolute;
            bottom: -10px;
            width: 10px;
            height: 40px;
            background: white;
            left: 15px;
        }
        .knee-pad {
            position: absolute;
            top: 10px;
            left: -5px;
            width: 20px;
            height: 20px;
            border: 2px solid black;
            background: white;
            border-radius: 5px;
        }

        /* Animation Keyframes */
        @keyframes proRide {
            0% { left: -20%; bottom: 50px; transform: rotate(0deg); }
            35% { left: 35%; bottom: 50px; transform: rotate(-5deg); }
            /* Climbing the big hill */
            45% { bottom: 230px; transform: rotate(-25deg); }
            50% { left: 50%; bottom: 300px; transform: rotate(0deg); }
            /* Descending */
            55% { bottom: 230px; transform: rotate(25deg); }
            65% { left: 65%; bottom: 50px; transform: rotate(5deg); }
            100% { left: 115%; bottom: 50px; transform: rotate(0deg); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="clock">00:00:00</div>

    <div class="stage">
        <div class="road-line"></div>
        <div class="hill"></div>

        <div class="rider-unit">
            <!-- The Gear-up Rider -->
            <div class="person">
                <div class="helmet-head">
                    <div class="visor"></div>
                </div>
                <div class="torso"></div>
                <div class="arm front">
                    <div class="elbow-pad"></div>
                </div>
                <div class="leg">
                    <div class="knee-pad"></div>
                </div>
            </div>

            <!-- The Wheel (EUC) -->
            <div class="euc-body">
                <div class="tire"></div>
            </div>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const time = now.getHours().toString().padStart(2, '0') + ":" + 
                         now.getMinutes().toString().padStart(2, '0') + ":" + 
                         now.getSeconds().toString().padStart(2, '0');
            document.getElementById('clock').innerText = time;
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
