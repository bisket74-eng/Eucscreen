<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LED String Light Fence</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; }
        canvas { display: block; }
    </style>
</head>
<body>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';

    // --- SCENE SETUP ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- CONFIGURATION ---
    const poleCount = 6;
    const poleSpacing = 5;
    const poleHeight = 3.5;
    const lightsPerSegment = 15;
    const sagIntensity = 0.5; // How much the string "hangs"
    const bulbs = [];

    // --- MATERIALS ---
    const poleMaterial = new THREE.MeshStandardMaterial({ color: 0x222222 });
    const wireMaterial = new THREE.LineBasicMaterial({ color: 0x111111 });
    const bulbGeometry = new THREE.SphereGeometry(0.05, 8, 8);

    // --- GENERATION LOGIC ---
    for (let i = 0; i < poleCount; i++) {
        const xPos = i * poleSpacing - (poleCount * poleSpacing) / 2;

        // 1. Create Pole
        const poleGeo = new THREE.CylinderGeometry(0.08, 0.08, poleHeight);
        const pole = new THREE.Mesh(poleGeo, poleMaterial);
        pole.position.set(xPos, poleHeight / 2, 0);
        scene.add(pole);

        // 2. Create Strings between poles
        if (i < poleCount - 1) {
            const nextX = (i + 1) * poleSpacing - (poleCount * poleSpacing) / 2;
            const curvePoints = [];

            for (let j = 0; j <= lightsPerSegment; j++) {
                const t = j / lightsPerSegment;
                const x = THREE.MathUtils.lerp(xPos, nextX, t);
                
                // Parabolic sag formula: y = height - (sag * parabolic curve)
                const y = poleHeight - (sagIntensity * Math.sin(t * Math.PI)); 
                const z = 0;

                const pos = new THREE.Vector3(x, y, z);
                curvePoints.push(pos);

                // 3. Create LED Bulbs (except at the very start/end of the string)
                if (j > 0 && j < lightsPerSegment) {
                    const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffee });
                    const bulb = new THREE.Mesh(bulbGeometry, lightMat);
                    bulb.position.copy(pos);
                    
                    // Add custom data for the twinkle effect
                    bulb.userData = {
                        offset: Math.random() * Math.PI * 2,
                        speed: 2 + Math.random() * 3
                    };
                    
                    scene.add(bulb);
                    bulbs.push(bulb);

                    // Add a tiny point light to a few of them for "glow" 
                    if (Math.random() > 0.7) {
                        const pLight = new THREE.PointLight(0xffffff, 0.5, 2);
                        pLight.position.copy(pos);
                        scene.add(pLight);
                    }
                }
            }

            // Draw the wire
            const curve = new THREE.CatmullRomCurve3(curvePoints);
            const wireGeo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(50));
            const wire = new THREE.Line(wireGeo, wireMaterial);
            scene.add(wire);
        }
    }

    // --- LIGHTING & ENVIRONMENT ---
    const ambient = new THREE.AmbientLight(0x404040, 0.5);
    scene.add(ambient);

    camera.position.set(0, 4, 10);
    camera.lookAt(0, 2, 0);

    // --- ANIMATION LOOP ---
    function animate(time) {
        requestAnimationFrame(animate);

        // Make the bulbs twinkle
        bulbs.forEach(bulb => {
            const t = time * 0.001; // convert to seconds
            const brightness = Math.sin(t * bulb.userData.speed + bulb.userData.offset) * 0.5 + 0.5;
            
            // Adjust opacity/color to simulate twinkle
            bulb.material.color.setRGB(brightness, brightness, brightness * 0.8);
            bulb.scale.setScalar(0.8 + brightness * 0.4);
        });

        renderer.render(scene, camera);
    }

    // Handle Resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
