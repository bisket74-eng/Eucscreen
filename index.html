<!DOCTYPE html>
<html>
<head>
    <title>EUC Mountain Slalom</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Red 12-Hour Clock */
        #clock {
            position: absolute;
            top: 5%;
            color: #ff0000;
            font-family: 'Arial', sans-serif;
            font-size: 4rem;
            font-weight: bold;
            z-index: 50;
        }

        .mountain-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Brown Dirt Jumps */
        .mound {
            position: absolute;
            width: 150px;
            height: 40px;
            background: #8B4513; /* Brown Dirt */
            border-radius: 50% 50% 0 0;
            z-index: 5;
        }
        /* Positioned along the zigzag path */
        .m1 { top: 25%; left: 30%; transform: rotate(15deg); }
        .m2 { top: 50%; left: 60%; transform: rotate(-15deg); }
        .m3 { top: 75%; left: 30%; transform: rotate(15deg); }

        /* THE RIDER UNIT */
        .rider-unit {
            position: absolute;
            width: 80px;
            height: 150px;
            z-index: 10;
            animation: slalomJourney 10s linear infinite;
        }

        /* EUC WHEEL */
        .euc-wheel {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            border: 4px solid white;
            border-radius: 50%;
            background: #111;
        }

        .spoke {
            position: absolute;
            top: 50%;
            width: 100%;
            height: 2px;
            background: white;
            animation: spin 0.2s linear infinite;
        }

        /* HUMAN RIDER */
        .human {
            position: absolute;
            bottom: 25px;
            width: 100%;
            height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: bottom center;
            animation: riderPhysics 10s linear infinite;
        }

        .boot {
            position: absolute;
            bottom: -5px;
            width: 22px;
            height: 14px;
            background: #000;
            border: 1.5px solid #ff0000;
            border-radius: 3px 8px 2px 3px;
        }

        .leg-main {
            position: absolute;
            bottom: 0;
            width: 16px;
            height: 70px;
            background: #1a1a1a;
            border-radius: 4px;
        }

        .torso-main {
            position: absolute;
            bottom: 65px;
            width: 28px;
            height: 65px;
            background: #333;
            border-radius: 6px;
        }

        .backpack {
            position: absolute;
            top: 8px;
            left: -12px;
            width: 14px;
            height: 40px;
            background: #d00;
            border-radius: 3px;
            border: 1px solid white;
        }

        .strap {
            position: absolute;
            top: 8px;
            left: -2px;
            width: 32px;
            height: 4px;
            background: #d00;
        }

        .arm-main {
            position: absolute;
            top: 10px;
            right: -5px;
            width: 10px;
            height: 50px;
            background: #333;
            border-radius: 5px;
        }

        .helmet-red {
            position: absolute;
            top: -45px;
            left: -5px;
            width: 40px;
            height: 40px;
            background: #ff0000;
            border: 2px solid white;
            border-radius: 50% 50% 20% 45%;
        }

        .visor {
            position: absolute;
            top: 10px;
            right: -2px;
            width: 22px;
            height: 12px;
            background: black;
            border-radius: 0 6px 6px 0;
        }

        /* SLALOM ZIGZAG ANIMATION */
        @keyframes slalomJourney {
            /* Start Top Left */
            0% { top: -10%; left: 10%; transform: scaleX(1); }
            
            /* First leg: Down to Right + Jump 1 */
            15% { top: 15%; left: 25%; }
            20% { top: 20%; left: 30%; z-index: 15; } /* Hit Jump 1 */
            25% { top: 10%; left: 40%; } /* Air time */
            30% { top: 35%; left: 55%; transform: scaleX(1); } /* Landing */

            /* Turn: Slide to Left + Jump 2 */
            35% { transform: scaleX(-1); } /* Pivot face left */
            45% { top: 45%; left: 65%; }
            50% { top: 45%; left: 60%; z-index: 15; } /* Hit Jump 2 */
            55% { top: 35%; left: 45%; } /* Air time */
            65% { top: 65%; left: 25%; transform: scaleX(-1); } /* Landing */

            /* Final leg: Back to Right + Jump 3 */
            70% { transform: scaleX(1); } /* Pivot face right */
            75% { top: 70%; left: 30%; }
            80% { top: 70%; left: 35%; z-index: 15; } /* Hit Jump 3 */
            85% { top: 60%; left: 55%; } /* Air time */
            100% { top: 110%; left: 90%; transform: scaleX(1); } /* Exit */
        }

        @keyframes riderPhysics {
            /* Knees bending on landing phases */
            0%, 28%, 63%, 88% { transform: scaleY(1); }
            30%, 65%, 90% { transform: scaleY(0.8); } /* Impact absorption */
            35%, 70%, 100% { transform: scaleY(1); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="clock">12:00:00 PM</div>

    <div class="mountain-container">
        <!-- Trail Jumps -->
        <div class="mound m1"></div>
        <div class="mound m2"></div>
        <div class="mound m3"></div>

        <div class="rider-unit">
            <div class="euc-wheel"><div class="spoke"></div></div>
            <div class="human">
                <div class="leg-main"></div>
                <div class="boot"></div>
                <div class="torso-main">
                    <div class="backpack"></div>
                    <div class="strap"></div>
                    <div class="helmet-red"><div class="visor"></div></div>
                    <div class="arm-main"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            document.getElementById('clock').innerText = `${hours}:${minutes}:${seconds} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
