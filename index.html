<!DOCTYPE html>
<html>
<head>
    <title>EUC Motocross - Refined Silhouette</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        /* --- HEADER & RAINBOW WAVE --- */
        #header-container {
            position: absolute;
            top: 8%;
            text-align: center;
            z-index: 20;
            width: 100%;
        }

        #nwef {
            font-size: 10rem;
            font-weight: 900;
            margin: 0;
            line-height: 0.8;
            letter-spacing: -2px;
            text-transform: uppercase;
            background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff, #ff0000);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowWave 3s linear infinite;
        }

        @keyframes rainbowWave { to { background-position: 200% center; } }

        #countdown {
            color: #fff;
            font-size: 1.8rem;
            font-weight: bold;
            margin-top: 15px;
        }

        #clock {
            position: absolute;
            top: 2%;
            color: #ff0000;
            font-size: 2.5rem;
            font-weight: bold;
            z-index: 20;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 600px;
        }

        /* --- BROWN DIRT MOUNDS (Flat Top) --- */
        .mound {
            position: absolute;
            bottom: 100px;
            width: 180px;
            height: 50px;
            background: #5d4037; /* Brown Dirt */
            /* Tabletop shape: Angled sides, flat top */
            clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
            z-index: 2;
        }
        .m1 { left: 15%; }
        .m2 { left: 45%; }
        .m3 { left: 75%; }

        .road-line {
            position: absolute;
            bottom: 100px;
            width: 100%;
            height: 4px;
            background: white;
            z-index: 2;
        }

        /* --- REFINED RIDER UNIT --- */
        .rider-unit {
            position: absolute;
            bottom: 100px;
            left: -150px;
            width: 120px;
            height: 250px;
            z-index: 10;
            animation: tripleJump 8s linear infinite;
        }

        .euc-wheel {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 70px;
            border: 6px solid #fff;
            border-radius: 50%;
            background: #111;
            z-index: 5;
        }

        .human {
            position: absolute;
            bottom: 25px;
            width: 100%;
            height: 220px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: rotate(-10deg); /* Leaning forward */
            transform-origin: bottom center;
            animation: riderPhysics 8s linear infinite;
        }

        /* Shaped Legs */
        .leg-container {
            position: absolute;
            bottom: 0;
            width: 30px;
            height: 100px;
        }

        .thigh {
            position: absolute;
            top: 0;
            width: 24px;
            height: 55px;
            background: #1a1a1a;
            border-radius: 12px 12px 5px 5px;
        }

        .calf {
            position: absolute;
            top: 50px;
            width: 18px;
            height: 45px;
            background: #1a1a1a;
            border-radius: 4px 4px 8px 8px;
        }

        .mx-boot {
            position: absolute;
            bottom: -5px;
            left: -5px;
            width: 35px;
            height: 20px;
            background: #000;
            border: 1px solid #444;
            border-radius: 4px 12px 4px 4px;
        }

        /* Silhouette Torso */
        .jersey {
            position: absolute;
            bottom: 95px;
            width: 45px;
            height: 90px;
            background: #fff;
            border-radius: 20px 20px 5px 5px;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.05) 10px, rgba(0,0,0,0.05) 11px);
        }

        /* Bent Arm */
        .arm-bent {
            position: absolute;
            top: 15px;
            right: -15px;
            width: 45px;
            height: 50px;
        }

        .upper-arm {
            position: absolute;
            width: 16px;
            height: 35px;
            background: #fff;
            transform: rotate(-30deg);
            border-radius: 8px;
        }

        .forearm {
            position: absolute;
            top: 25px;
            right: 0px;
            width: 14px;
            height: 35px;
            background: #fff;
            transform: rotate(40deg);
            border-radius: 7px;
        }

        .mx-helmet {
            position: absolute;
            top: -55px;
            left: -2px;
            width: 52px;
            height: 52px;
            background: #ff0000;
            border-radius: 50% 50% 30% 30%;
            border: 2px solid white;
        }

        .mx-peak {
            position: absolute;
            top: 8px;
            right: -12px;
            width: 25px;
            height: 5px;
            background: #ff0000;
            border: 1px solid white;
            border-radius: 0 10px 10px 0;
        }

        .face-mask-small {
            position: absolute;
            top: 20px;
            right: 0;
            width: 28px;
            height: 12px;
            background: #111;
            border-radius: 0 4px 4px 0;
        }

        /* --- FENCE & LIGHTS --- */
        .pole { position: absolute; bottom: 100px; width: 4px; height: 220px; background: #222; }
        .led { fill: #fff; animation: twinkle var(--speed) ease-in-out infinite; animation-delay: var(--delay); }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; fill: #ff0000; } }

        /* Animations */
        @keyframes tripleJump {
            0%, 10%, 100% { left: -10%; bottom: 100px; }
            15% { left: 18%; bottom: 130px; transform: rotate(-15deg); }
            20% { left: 26%; bottom: 210px; transform: rotate(0deg); }
            25% { left: 34%; bottom: 100px; transform: rotate(10deg); }
            45% { left: 48%; bottom: 130px; transform: rotate(-15deg); }
            50% { left: 56%; bottom: 210px; transform: rotate(0deg); }
            55% { left: 64%; bottom: 100px; transform: rotate(10deg); }
            75% { left: 78%; bottom: 130px; transform: rotate(-15deg); }
            80% { left: 86%; bottom: 210px; transform: rotate(0deg); }
            85% { left: 94%; bottom: 100px; transform: rotate(10deg); }
            110% { left: 115%; }
        }

        @keyframes riderPhysics {
            0%, 22%, 52%, 82% { transform: scaleY(1) rotate(-10deg); bottom: 25px; }
            25%, 55%, 85% { transform: scaleY(0.75) rotate(-15deg); bottom: 10px; }
            30%, 60%, 90% { transform: scaleY(1) rotate(-10deg); bottom: 25px; }
        }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="clock">00:00:00 PM</div>

    <div id="header-container">
        <h1 id="nwef">NWEF</h1>
        <div id="countdown">Loading...</div>
    </div>

    <div class="stage">
        <div id="fence-layer"></div>
        <div class="road-line"></div>
        <div class="mound m1"></div>
        <div class="mound m2"></div>
        <div class="mound m3"></div>

        <div class="rider-unit">
            <div class="euc-wheel"><div style="position:absolute;top:50%;width:100%;height:3px;background:#fff;animation:spin 0.2s linear infinite;"></div></div>
            <div class="human">
                <div class="leg-container">
                    <div class="thigh"></div>
                    <div class="calf"></div>
                    <div class="mx-boot"></div>
                </div>
                <div class="jersey">
                    <div class="arm-bent">
                        <div class="upper-arm"></div>
                        <div class="forearm"></div>
                    </div>
                    <div class="mx-helmet">
                        <div class="mx-peak"></div>
                        <div class="face-mask-small"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const targetDate = new Date("July 15, 2026 00:00:00").getTime();
        function updateUI() {
            const now = new Date();
            let h = now.getHours();
            const m = String(now.getMinutes()).padStart(2, '0'), s = String(now.getSeconds()).padStart(2, '0');
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            document.getElementById('clock').innerText = `${h}:${m}:${s} ${ampm}`;
            const diff = targetDate - now.getTime();
            const d = Math.floor(diff / 864e5), hh = Math.floor((diff % 864e5) / 36e5), mm = Math.floor((diff % 36e5) / 6e4), ss = Math.floor((diff % 6e4) / 1e3);
            document.getElementById('countdown').innerText = `${d} Days | ${hh}h ${mm}m ${ss}s until July 15th, 2026`;
        }
        setInterval(updateUI, 1000); updateUI();

        const layer = document.getElementById('fence-layer'), count = 10, space = window.innerWidth / (count - 1);
        for (let i = 0; i < count; i++) {
            const p = document.createElement('div'); p.className = 'pole'; p.style.left = `${i * space}px`; layer.appendChild(p);
            if (i < count - 1) {
                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                svg.setAttribute('style', `position:absolute;bottom:280px;left:${i*space}px;width:${space}px;height:50px;overflow:visible;`);
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute('d', `M 0 0 Q ${space/2} 30 ${space} 0`); path.setAttribute('stroke', '#333'); path.setAttribute('fill', 'none'); svg.appendChild(path);
                for (let j = 1; j < 6; j++) {
                    const t = j / 6, bx = t * space, by = (1-t)*(1-t)*0 + 2*(1-t)*t*30 + t*t*0;
                    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    c.setAttribute('class', 'led'); c.setAttribute('cx', bx); c.setAttribute('cy', by); c.setAttribute('r', '2.5');
                    c.style.setProperty('--delay', `${Math.random()*2}s`); c.style.setProperty('--speed', `${1+Math.random()}s`); svg.appendChild(c);
                }
                layer.appendChild(svg);
            }
        }
    </script>
</body>
</html>
