<!DOCTYPE html>
<html>
<head>
    <title>EUC Pro - Side Profile Jump</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #clock {
            position: absolute;
            top: 5%;
            color: white;
            font-family: 'Arial', sans-serif;
            font-size: 4rem;
            font-weight: bold;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 600px;
        }

        .road-line {
            position: absolute;
            bottom: 100px;
            width: 100%;
            height: 4px;
            background: white;
        }

        /* The Kicker Ramp */
        .ramp {
            position: absolute;
            bottom: 100px;
            left: 40%;
            width: 200px;
            height: 100px;
            background: white;
            clip-path: polygon(0% 100%, 100% 0%, 100% 100%);
        }

        /* RIDER CONTAINER */
        .rider-unit {
            position: absolute;
            bottom: 100px;
            left: -150px;
            width: 80px;
            height: 220px;
            animation: jumpSequence 5s linear infinite;
        }

        /* Side View EUC Wheel */
        .euc-wheel {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 70px;
            border: 4px solid white;
            border-radius: 50%;
            background: black;
            box-sizing: border-box;
            z-index: 5;
        }

        .spoke {
            position: absolute;
            top: 50%;
            width: 100%;
            height: 2px;
            background: white;
            animation: spin 0.3s linear infinite;
        }

        /* Side Pedal - Placed behind the leg */
        .pedal-side {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 45px;
            height: 8px;
            background: white;
            z-index: 4;
            border-radius: 2px;
        }

        /* PROFILE RIDER */
        .rider-profile {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            z-index: 10; /* Leg is now outside the wheel */
        }

        /* Leg standing on pedal */
        .leg {
            position: absolute;
            bottom: 28px;
            left: 35px;
            width: 14px;
            height: 85px;
            background: white;
            border-radius: 7px;
            transform: rotate(-5deg);
        }

        /* Torso connected properly to the leg */
        .torso {
            position: absolute;
            bottom: 105px;
            left: 28px;
            width: 24px;
            height: 70px;
            background: white;
            transform: rotate(-15deg);
            border-radius: 6px;
        }

        /* Arm connected to the front of the torso */
        .arm {
            position: absolute;
            top: 5px;
            right: -10px;
            width: 10px;
            height: 55px;
            background: white;
            transform: rotate(-45deg);
            border-radius: 5px;
        }

        /* RED HELMET */
        .helmet-red {
            position: absolute;
            top: -50px;
            left: -5px;
            width: 45px;
            height: 45px;
            background: #ff0000;
            border: 3px solid white;
            border-radius: 50% 50% 15% 45%;
        }

        .visor-line {
            position: absolute;
            top: 12px;
            right: -2px;
            width: 24px;
            height: 12px;
            background: black;
            border-radius: 0 6px 6px 0;
        }

        /* JUMP ANIMATION - CALIBRATED TO RAMP HEIGHT */
        @keyframes jumpSequence {
            0% { 
                left: -10%; 
                bottom: 100px; 
                transform: rotate(0deg); 
            }
            /* Arrival at Ramp Base */
            30% { 
                left: 33%; 
                bottom: 100px; 
                transform: rotate(0deg); 
            }
            /* Riding UP the Ramp - Bottom of wheel follows white edge */
            40% { 
                left: 40%; 
                bottom: 100px; 
                transform: rotate(-26.5deg); /* Slope of the ramp */
            }
            /* Reaching the Peak */
            45% { 
                left: 50%; 
                bottom: 200px; 
                transform: rotate(-20deg); 
            }
            /* Airborne Arc */
            52% { 
                left: 60%; 
                bottom: 380px; 
                transform: rotate(-5deg); 
            }
            /* Landing */
            60% { 
                left: 75%; 
                bottom: 100px; 
                transform: rotate(10deg); 
            }
            70% { 
                left: 85%; 
                bottom: 100px; 
                transform: rotate(0deg); 
            }
            100% { 
                left: 115%; 
                bottom: 100px; 
                transform: rotate(0deg); 
            }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="clock">00:00:00</div>

    <div class="stage">
        <div class="road-line"></div>
        <div class="ramp"></div>

        <div class="rider-unit">
            <!-- EUC Base Components -->
            <div class="euc-wheel">
                <div class="spoke"></div>
            </div>
            <div class="pedal-side"></div>

            <!-- Profile Rider - Now Layered in Front -->
            <div class="rider-profile">
                <div class="leg"></div>
                <div class="torso">
                    <div class="helmet-red">
                        <div class="visor-line"></div>
                    </div>
                    <div class="arm"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('en-GB');
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
