<!DOCTYPE html>
<html>
<head>
    <title>EUC Motocross - Proper Jump Physics</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        /* --- HEADER & RAINBOW WAVE --- */
        #header-container {
            position: absolute;
            top: 8%;
            text-align: center;
            z-index: 20;
            width: 100%;
        }

        #nwef {
            font-size: 10rem;
            font-weight: 900;
            margin: 0;
            line-height: 0.8;
            letter-spacing: -2px;
            text-transform: uppercase;
            background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff, #ff0000);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowWave 3s linear infinite;
        }

        @keyframes rainbowWave { to { background-position: 200% center; } }

        #countdown {
            color: #fff;
            font-size: 1.8rem;
            font-weight: bold;
            margin-top: 15px;
        }

        #clock {
            position: absolute;
            top: 2%;
            color: #ff0000;
            font-size: 2.5rem;
            font-weight: bold;
            z-index: 20;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 600px;
        }

        /* --- SHORTENED DIRT MOUNDS (Tabletops) --- */
        .mound {
            position: absolute;
            bottom: 100px;
            width: 100px; /* Shortened */
            height: 40px;
            background: #5d4037;
            clip-path: polygon(25% 0%, 75% 0%, 100% 100%, 0% 100%);
            z-index: 2;
        }
        .m1 { left: 20%; }
        .m2 { left: 45%; }
        .m3 { left: 70%; }

        .road-line {
            position: absolute;
            bottom: 100px;
            width: 100%;
            height: 4px;
            background: white;
            z-index: 2;
        }

        /* --- RIDER UNIT --- */
        .rider-unit {
            position: absolute;
            bottom: 100px;
            left: -150px;
            width: 120px;
            height: 250px;
            z-index: 10;
            animation: tripleJump 6s linear infinite; /* Faster flow */
        }

        .euc-wheel {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 70px;
            border: 6px solid #fff;
            border-radius: 50%;
            background: #111;
            z-index: 5;
        }

        .human {
            position: absolute;
            bottom: 25px;
            width: 100%;
            height: 220px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: rotate(15deg); /* LEAN FORWARD */
            transform-origin: bottom center;
            animation: riderPhysics 6s linear infinite;
        }

        /* Shaped Legs */
        .thigh { position: absolute; top: 0; width: 24px; height: 55px; background: #1a1a1a; border-radius: 12px 12px 5px 5px; }
        .calf { position: absolute; top: 50px; width: 18px; height: 45px; background: #1a1a1a; border-radius: 4px; }
        .mx-boot { position: absolute; bottom: -5px; left: -5px; width: 35px; height: 20px; background: #000; border: 1px solid #444; border-radius: 4px 10px 2px 4px; }

        /* Torso & Outlined Arm */
        .jersey {
            position: absolute;
            bottom: 95px;
            width: 45px;
            height: 90px;
            background: #fff;
            border-radius: 20px 20px 5px 5px;
        }

        .arm-side {
            position: absolute;
            top: 20px;
            right: -10px;
            width: 18px;
            height: 65px;
            background: #fff;
            border: 1.5px solid #ccc; /* Outline for visibility */
            border-radius: 9px;
            transform: rotate(-10deg);
        }

        .mx-helmet {
            position: absolute;
            top: -55px;
            left: -2px;
            width: 52px;
            height: 52px;
            background: #ff0000;
            border-radius: 50% 50% 30% 30%;
            border: 2px solid white;
        }

        .mx-peak {
            position: absolute;
            top: 8px;
            right: -12px;
            width: 25px;
            height: 5px;
            background: #ff0000;
            border: 1px solid white;
            border-radius: 0 10px 10px 0;
        }

        .face-mask-small {
            position: absolute;
            top: 22px;
            right: 0;
            width: 25px;
            height: 10px;
            background: #111;
            border-radius: 0 4px 4px 0;
        }

        /* --- FENCE --- */
        .pole { position: absolute; bottom: 100px; width: 4px; height: 220px; background: #222; }
        .led { fill: #fff; animation: twinkle var(--speed) ease-in-out infinite; animation-delay: var(--delay); }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; fill: #ff0000; } }

        /* --- IMPROVED PHYSICS ANIMATION --- */
        @keyframes tripleJump {
            0% { left: -15%; bottom: 100px; }
            
            /* Jump 1 (Starts at 20%) */
            18% { bottom: 100px; } 
            20% { bottom: 140px; left: 20%; } /* Climbing the mound */
            25% { bottom: 250px; left: 28%; } /* Peak */
            30% { bottom: 100px; left: 36%; } /* Landing */

            /* Jump 2 (Starts at 45%) */
            43% { bottom: 100px; }
            45% { bottom: 140px; left: 45%; }
            50% { bottom: 250px; left: 53%; }
            55% { bottom: 100px; left: 61%; }

            /* Jump 3 (Starts at 70%) */
            68% { bottom: 100px; }
            70% { bottom: 140px; left: 70%; }
            75% { bottom: 250px; left: 78%; }
            80% { bottom: 100px; left: 86%; }

            100% { left: 115%; bottom: 100px; } /* Go all the way off screen */
        }

        @keyframes riderPhysics {
            /* Lean and squash on landings */
            0%, 28%, 53%, 78% { transform: scaleY(1) rotate(15deg); }
            30%, 55%, 80% { transform: scaleY(0.8) rotate(20deg); } /* Impact squash */
            35%, 60%, 85% { transform: scaleY(1) rotate(15deg); }
        }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="clock">00:00:00 PM</div>

    <div id="header-container">
        <h1 id="nwef">NWEF</h1>
        <div id="countdown">Loading...</div>
    </div>

    <div class="stage">
        <div id="fence-layer"></div>
        <div class="road-line"></div>
        <div class="mound m1"></div>
        <div class="mound m2"></div>
        <div class="mound m3"></div>

        <div class="rider-unit">
            <div class="euc-wheel"><div style="position:absolute;top:50%;width:100%;height:3px;background:#fff;animation:spin 0.2s linear infinite;"></div></div>
            <div class="human">
                <div style="position:absolute;bottom:0;width:30px;height:100px;">
                    <div class="thigh"></div>
                    <div class="calf"></div>
                    <div class="mx-boot"></div>
                </div>
                <div class="jersey">
                    <div class="arm-side"></div>
                    <div class="mx-helmet">
                        <div class="mx-peak"></div>
                        <div class="face-mask-small"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const targetDate = new Date("July 15, 2026 00:00:00").getTime();
        function updateUI() {
            const now = new Date();
            let h = now.getHours();
            const m = String(now.getMinutes()).padStart(2, '0'), s = String(now.getSeconds()).padStart(2, '0');
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            document.getElementById('clock').innerText = `${h}:${m}:${s} ${ampm}`;
            const diff = targetDate - now.getTime();
            const d = Math.floor(diff / 864e5), hh = Math.floor((diff % 864e5) / 36e5), mm = Math.floor((diff % 36e5) / 6e4), ss = Math.floor((diff % 6e4) / 1e3);
            document.getElementById('countdown').innerText = `${d} Days | ${hh}h ${mm}m ${ss}s until July 15th, 2026`;
        }
        setInterval(updateUI, 1000); updateUI();

        const layer = document.getElementById('fence-layer'), count = 10, space = window.innerWidth / (count - 1);
        for (let i = 0; i < count; i++) {
            const p = document.createElement('div'); p.className = 'pole'; p.style.left = `${i * space}px`; layer.appendChild(p);
            if (i < count - 1) {
                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                svg.setAttribute('style', `position:absolute;bottom:280px;left:${i*space}px;width:${space}px;height:50px;overflow:visible;`);
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute('d', `M 0 0 Q ${space/2} 30 ${space} 0`); path.setAttribute('stroke', '#333'); path.setAttribute('fill', 'none'); svg.appendChild(path);
                for (let j = 1; j < 6; j++) {
                    const t = j / 6, bx = t * space, by = (1-t)*(1-t)*0 + 2*(1-t)*t*30 + t*t*0;
                    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    c.setAttribute('class', 'led'); c.setAttribute('cx', bx); c.setAttribute('cy', by); c.setAttribute('r', '2.5');
                    c.style.setProperty('--delay', `${Math.random()*2}s`); c.style.setProperty('--speed', `${1+Math.random()}s`); svg.appendChild(c);
                }
                layer.appendChild(svg);
            }
        }
    </script>
</body>
</html>
