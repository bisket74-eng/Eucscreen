<!DOCTYPE html>
<html>
<head>
    <title>EUC Pro - Gear & Backpack</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #clock {
            position: absolute;
            top: 5%;
            color: white;
            font-family: 'Arial', sans-serif;
            font-size: 4rem;
            font-weight: bold;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 600px;
        }

        .road-line {
            position: absolute;
            bottom: 100px;
            width: 100%;
            height: 4px;
            background: white;
        }

        .ramp {
            position: absolute;
            bottom: 100px;
            left: 40%;
            width: 200px;
            height: 100px;
            background: white;
            clip-path: polygon(0% 100%, 100% 0%, 100% 100%);
        }

        .rider-unit {
            position: absolute;
            bottom: 100px;
            left: -150px;
            width: 100px;
            height: 240px;
            animation: jumpSequence 5s linear infinite;
        }

        /* EUC WHEEL */
        .euc-wheel {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 75px;
            height: 75px;
            border: 5px solid white;
            border-radius: 50%;
            background: #222;
            box-sizing: border-box;
            z-index: 5;
        }

        .spoke {
            position: absolute;
            top: 50%;
            width: 100%;
            height: 3px;
            background: white;
            animation: spin 0.2s linear infinite;
        }

        .pedal {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 10px;
            background: #777;
            border: 1px solid white;
            z-index: 4;
        }

        /* HUMAN RIDER */
        .human {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        /* Black Pants - Thicker Leg */
        .leg-main {
            position: absolute;
            bottom: 30px;
            left: 42px;
            width: 18px;
            height: 90px;
            background: #222; /* Black Pants */
            border: 1px solid #444;
            border-radius: 8px;
            transform: rotate(-3deg);
        }

        /* T-Shirt Torso */
        .torso-main {
            position: absolute;
            bottom: 115px;
            left: 35px;
            width: 32px;
            height: 75px;
            background: #444; /* Grey T-Shirt */
            border-radius: 8px;
            transform: rotate(-10deg);
        }

        /* Red Backpack */
        .backpack {
            position: absolute;
            top: 10px;
            left: -12px;
            width: 18px;
            height: 45px;
            background: #d00; /* Red */
            border-radius: 5px;
            border: 1px solid white;
        }

        /* Human Arm */
        .arm-main {
            position: absolute;
            top: 10px;
            right: -8px;
            width: 12px;
            height: 55px;
            background: #444; /* Match T-shirt */
            border-radius: 6px;
            transform: rotate(-40deg);
            transform-origin: top center;
        }

        /* Red Helmet */
        .helmet-red {
            position: absolute;
            top: -55px;
            left: -5px;
            width: 48px;
            height: 48px;
            background: #ff0000;
            border: 2px solid white;
            border-radius: 50% 50% 20% 45%;
        }

        .visor {
            position: absolute;
            top: 12px;
            right: -2px;
            width: 25px;
            height: 14px;
            background: black;
            border-radius: 0 8px 8px 0;
        }

        /* PHYSICS ANIMATION */
        @keyframes jumpSequence {
            0% { left: -10%; bottom: 100px; transform: rotate(0deg); }
            30% { left: 32%; bottom: 100px; transform: rotate(0deg); }
            /* Wheel base hits ramp and angles up */
            40% { 
                left: 40%; 
                bottom: 100px; 
                transform: rotate(-26deg); 
            }
            /* Airborne */
            45% { left: 50%; bottom: 200px; transform: rotate(-15deg); }
            52% { left: 60%; bottom: 380px; transform: rotate(0deg); }
            /* Landing */
            60% { left: 75%; bottom: 100px; transform: rotate(10deg); }
            70% { left: 85%; bottom: 100px; transform: rotate(0deg); }
            100% { left: 115%; bottom: 100px; transform: rotate(0deg); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="clock">00:00:00</div>

    <div class="stage">
        <div class="road-line"></div>
        <div class="ramp"></div>

        <div class="rider-unit">
            <div class="euc-wheel"><div class="spoke"></div></div>
            <div class="pedal"></div>

            <div class="human">
                <div class="leg-main"></div>
                <div class="torso-main">
                    <div class="backpack"></div>
                    <div class="helmet-red"><div class="visor"></div></div>
                    <div class="arm-main"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('en-GB');
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
