<!DOCTYPE html>
<html>
<head>
    <title>EUC Pro - Red Helmet Jump</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #clock {
            position: absolute;
            top: 5%;
            color: white;
            font-family: 'Arial', sans-serif;
            font-size: 4rem;
            font-weight: bold;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 600px;
        }

        /* The Road */
        .road-line {
            position: absolute;
            bottom: 100px;
            width: 100%;
            height: 4px;
            background: white;
        }

        /* The Kicker Ramp */
        .ramp {
            position: absolute;
            bottom: 100px;
            left: 40%; /* Positioned for the animation timing */
            width: 180px;
            height: 90px;
            background: white;
            clip-path: polygon(0% 100%, 100% 0%, 100% 100%);
        }

        /* RIDER CONTAINER */
        .rider-unit {
            position: absolute;
            bottom: 100px;
            left: -150px;
            width: 80px;
            height: 200px;
            animation: jumpSequence 5s linear infinite;
        }

        /* Side View EUC Wheel */
        .euc-wheel {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 65px;
            height: 65px;
            border: 4px solid white;
            border-radius: 50%;
            background: black;
            box-sizing: border-box;
        }

        .spoke {
            position: absolute;
            top: 50%;
            width: 100%;
            height: 2px;
            background: white;
            animation: spin 0.3s linear infinite;
        }

        /* Side Pedal */
        .pedal-side {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 38px;
            height: 7px;
            background: white;
            z-index: 15;
            border-radius: 2px;
        }

        /* PROFILE RIDER */
        .rider-profile {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 160px;
        }

        .leg {
            position: absolute;
            bottom: 0;
            left: 14px;
            width: 12px;
            height: 75px;
            background: white;
            border-radius: 6px;
        }

        .torso {
            position: absolute;
            bottom: 75px;
            left: 8px;
            width: 22px;
            height: 65px;
            background: white;
            transform: rotate(-12deg);
            border-radius: 5px;
        }

        .arm {
            position: absolute;
            top: 5px;
            left: 4px;
            width: 8px;
            height: 55px;
            background: white;
            transform: rotate(-35deg);
            border-radius: 4px;
        }

        /* RED HELMET */
        .helmet-red {
            position: absolute;
            top: -48px;
            left: -6px;
            width: 42px;
            height: 42px;
            background: #ff0000; /* Bright Red */
            border: 3px solid white;
            border-radius: 50% 50% 15% 45%;
        }

        .visor-line {
            position: absolute;
            top: 10px;
            right: -2px;
            width: 22px;
            height: 12px;
            background: black;
            border-radius: 0 6px 6px 0;
        }

        /* UPDATED JUMP ANIMATION */
        @keyframes jumpSequence {
            0% { 
                left: -10%; 
                bottom: 100px; 
                transform: rotate(0deg); 
            }
            /* Reaches the ramp base exactly at 40% of screen */
            30% { 
                left: 32%; 
                bottom: 100px; 
                transform: rotate(0deg); 
            }
            /* Riding up the incline (starts at 40% left) */
            40% { 
                left: 40%; 
                bottom: 100px; 
                transform: rotate(-26deg); 
            }
            /* Launching from the tip */
            45% { 
                left: 48%; 
                bottom: 190px; 
                transform: rotate(-20deg); 
            }
            /* Peak of air time */
            52% { 
                left: 58%; 
                bottom: 380px; 
                transform: rotate(-5deg); 
            }
            /* Landing back on the road */
            60% { 
                left: 72%; 
                bottom: 100px; 
                transform: rotate(15deg); 
            }
            /* Leveling out */
            70% { 
                left: 85%; 
                bottom: 100px; 
                transform: rotate(0deg); 
            }
            100% { 
                left: 115%; 
                bottom: 100px; 
                transform: rotate(0deg); 
            }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="clock">00:00:00</div>

    <div class="stage">
        <div class="road-line"></div>
        <div class="ramp"></div>

        <div class="rider-unit">
            <div class="rider-profile">
                <div class="leg"></div>
                <div class="torso">
                    <div class="helmet-red">
                        <div class="visor-line"></div>
                    </div>
                    <div class="arm"></div>
                </div>
            </div>

            <div class="euc-wheel">
                <div class="spoke"></div>
            </div>
            <div class="pedal-side"></div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('en-GB');
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
