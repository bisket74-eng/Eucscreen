<!DOCTYPE html>
<html>
<head>
    <title>NWEF EUC - Forest Glow</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Segoe UI', sans-serif; }

        /* --- BACKGROUND FOREST --- */
        #forest-container {
            position: absolute;
            bottom: 20px;
            width: 100%; height: 100%;
            z-index: 0;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
        }

        .tree {
            background-color: #080808;
            clip-path: polygon(50% 0%, 60% 20%, 55% 20%, 65% 40%, 58% 40%, 75% 65%, 65% 65%, 90% 100%, 10% 100%, 35% 65%, 25% 65%, 42% 40%, 35% 40%, 45% 20%, 40% 20%);
            border-top: 1px solid rgba(255,255,255,0.1);
            position: absolute;
            bottom: 0;
            transform-origin: bottom;
        }

        /* --- DASHBOARD --- */
        #dashboard { position: absolute; top: 5%; display: flex; align-items: center; justify-content: space-between; width: 92%; z-index: 100; }
        #clock { color: #bc13fe; font-size: 3.5rem; font-weight: 900; text-shadow: 0 0 20px #bc13fe; font-family: monospace; }
        #nwef { font-size: 15rem; font-weight: 900; background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff, #ff0000); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: rainbowWave 3s linear infinite; }
        #countdown { color: #ff9100; font-size: 2.2rem; font-weight: 900; text-align: right; text-shadow: 0 0 15px #ff9100; line-height: 1.1; }
        @keyframes rainbowWave { to { background-position: 200% center; } }

        /* --- STAGE --- */
        .stage { position: relative; width: 100%; height: 100vh; z-index: 10; }
        .road-line { position: absolute; bottom: 20px; width: 100%; height: 6px; background: #222; z-index: 15; }

        .mound {
            position: absolute; bottom: 20px; width: 450px; height: 35px; background: #4e342e;
            clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%); left: 35%; z-index: 16;
            background-image: linear-gradient(to right, transparent, rgba(0,255,100,0.4), transparent);
            background-size: 200px 100%; background-repeat: no-repeat; background-position: -200px 0;
            animation: spotlightPass 7s linear infinite;
        }
        @keyframes spotlightPass { 0%, 35% { background-position: -200px 0; } 40%, 55% { background-position: 600px 0; } 60%, 100% { background-position: 600px 0; } }

        /* --- RIDER & EUC --- */
        .rider-unit {
            position: absolute; bottom: 20px; left: -300px;
            width: 200px; height: 350px; z-index: 50;
            animation: proJump 7s linear infinite;
        }

        .euc-base { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 100px; height: 100px; z-index: 20; }
        .tire { position: absolute; bottom: 0; left: 5px; width: 90px; height: 90px; background: #111; border: 5px solid #333; border-radius: 50%; }
        .shell { position: absolute; top: 0; left: 15px; width: 70px; height: 80px; background: #222; border-radius: 15px; border-left: 5px solid #ff0000; }

        .human {
            position: absolute; bottom: 40px; width: 100%; height: 300px;
            z-index: 60; display: flex; flex-direction: column; align-items: center;
            transform: rotate(15deg); transform-origin: bottom center;
            animation: suspension 7s linear infinite;
        }

        /* Improved Legs */
        .thigh { position: absolute; bottom: 45px; width: 28px; height: 60px; background: #1a1a1a; border-radius: 12px; }
        .calf { position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); width: 20px; height: 50px; background: #1a1a1a; border-radius: 4px; }
        .boot { position: absolute; bottom: -5px; left: 10px; width: 55px; height: 24px; background: #000; border: 1.5px solid #444; border-radius: 4px 15px 3px 5px; box-shadow: 0 0 10px rgba(255,0,0,0.3); }

        .torso { position: absolute; bottom: 100px; width: 40px; height: 120px; background: #fff; border-radius: 18px; }
        
        /* Shoulder & Arm */
        .shoulder { position: absolute; top: 10px; right: -5px; width: 18px; height: 18px; background: #fff; border-radius: 50%; }
        .arm-upper { position: absolute; top: 20px; right: -15px; width: 16px; height: 50px; background: #fff; border-radius: 8px; transform: rotate(-5deg); }
        .arm-fore { position: absolute; top: 55px; right: -30px; width: 14px; height: 55px; background: #fff; border-radius: 7px; transform: rotate(50deg); }
        
        /* Green Glow Wand */
        .wand { position: absolute; bottom: -10px; right: -25px; width: 45px; height: 10px; background: #00ff66; border-radius: 5px; box-shadow: 0 0 20px #00ff66; transform: rotate(-10deg); }
        .wand-beam { position: absolute; top: 50%; left: 30px; width: 450px; height: 130px; background: radial-gradient(ellipse at left, rgba(0,255,100,0.3) 0%, transparent 80%); transform: translateY(-50%); }

        .mtb-helmet {
            position: absolute; top: -55px; left: -2px; width: 52px; height: 50px;
            background: #ff0000; border: 2px solid white; border-radius: 45%;
        }
        .chin-strap { position: absolute; bottom: 10px; right: -3px; width: 18px; height: 4px; background: #ff0000; border: 1px solid white; }

        .pole { position: absolute; bottom: 20px; width: 6px; height: 260px; background: #222; z-index: 15; }

        @keyframes proJump {
            0% { left: -25%; bottom: 20px; }
            35% { left: 30%; bottom: 18px; }
            40% { left: 45%; bottom: 80px; } 
            50% { left: 55%; bottom: 170px; } 
            60% { left: 85%; bottom: 20px; } 
            100% { left: 125%; bottom: 20px; }
        }

        @keyframes suspension {
            0%, 30% { transform: scaleY(1) translateY(0) rotate(15deg); }
            35% { transform: scaleY(0.6) translateY(35px) rotate(15deg); } 
            40%, 55% { transform: scaleY(1.1) translateY(-10px) rotate(15deg); } 
            60% { transform: scaleY(0.65) translateY(35px) rotate(20deg); } 
            66% { transform: scaleY(1) translateY(0) rotate(15deg); }
        }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="dashboard">
        <div id="clock">00:00:00 AM</div>
        <h1 id="nwef">NWEF</h1>
        <div id="countdown">T-MINUS<br>-- DAYS<br>--:--:--</div>
    </div>

    <div id="forest-container"></div>

    <div class="stage">
        <div id="fence-layer"></div>
        <div class="road-line"></div>
        <div class="mound"></div>

        <div class="rider-unit">
            <div class="euc-base">
                <div class="shell"></div>
                <div class="tire">
                    <div style="position:absolute;top:50%;left:50%;width:40px;height:40px;border:4px solid #fff;border-radius:50%;transform:translate(-50%,-50%);">
                        <div style="position:absolute;top:50%;width:100%;height:3px;background:#fff;animation:spin 0.1s linear infinite;"></div>
                    </div>
                </div>
            </div>

            <div class="human">
                <div class="thigh">
                    <div class="calf"></div>
                    <div class="boot"></div>
                </div>
                <div class="torso">
                    <div class="shoulder"></div>
                    <div class="arm-upper"></div>
                    <div class="arm-fore">
                        <div class="wand"><div class="wand-beam"></div></div>
                    </div>
                    <div class="mtb-helmet">
                        <div class="chin-strap"></div>
                        <div style="position:absolute; top:20px; right:0; width:10px; height:10px; background:#111; border-radius:2px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Generate Forest
        const forest = document.getElementById('forest-container');
        for(let i=0; i<30; i++) {
            const tree = document.createElement('div');
            tree.className = 'tree';
            const h = 40 + Math.random() * 55; 
            tree.style.height = h + '%';
            tree.style.width = (100 + Math.random() * 150) + 'px';
            tree.style.left = (i * 4) + '%';
            tree.style.opacity = 0.5 + (Math.random() * 0.5);
            forest.appendChild(tree);
        }

        // Time Logic
        const targetDate = new Date("July 15, 2026 00:00:00").getTime();
        function updateUI() {
            const now = new Date();
            let h = now.getHours();
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            document.getElementById('clock').innerText = `${String(h).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')} ${ampm}`;
            const diff = targetDate - now.getTime();
            const d = Math.floor(diff / 864e5), hh = Math.floor((diff % 864e5) / 36e5), mm = Math.floor((diff % 36e5) / 6e4), ss = Math.floor((diff % 6e4) / 1e3);
            document.getElementById('countdown').innerHTML = `T-MINUS<br>${d} DAYS<br>${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
        }
        setInterval(updateUI, 1000); updateUI();

        // Fence Logic
        const layer = document.getElementById('fence-layer'), count = 5, space = window.innerWidth / (count - 1);
        for (let i = 0; i < count; i++) {
            const p = document.createElement('div'); p.className = 'pole'; p.style.left = `${i * space}px`; layer.appendChild(p);
            if (i < count - 1) {
                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                svg.setAttribute('style', `position:absolute;bottom:280px;left:${i*space}px;width:${space}px;height:100px;overflow:visible;`);
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute('d', `M 0 0 Q ${space/2} 80 ${space} 0`); path.setAttribute('stroke', '#333'); path.setAttribute('fill', 'none'); svg.appendChild(path);
                for (let j = 1; j < 8; j++) {
                    const t = j / 8, bx = t * space, by = (1-t)*(1-t)*0 + 2*(1-t)*t*80 + t*t*0;
                    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    c.setAttribute('cx', bx); c.setAttribute('cy', by); c.setAttribute('r', '3'); c.setAttribute('fill', '#fff');
                    c.style.animation = `twinkle ${1+Math.random()}s infinite`; svg.appendChild(c);
                }
                layer.appendChild(svg);
            }
        }
    </script>
    <style>@keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; fill: #ff0000; } }</style>
</body>
</html>
