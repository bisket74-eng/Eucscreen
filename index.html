<!DOCTYPE html>
<html>
<head>
    <title>EUC Ramp Jump - Profile View</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #clock {
            position: absolute;
            top: 5%;
            color: white;
            font-family: 'Arial', sans-serif;
            font-size: 4rem;
            font-weight: bold;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 600px;
        }

        .road-line {
            position: absolute;
            bottom: 100px;
            width: 100%;
            height: 4px;
            background: white;
        }

        /* The Ramp (Kicker) */
        .ramp {
            position: absolute;
            bottom: 100px;
            left: 45%;
            width: 150px;
            height: 80px;
            background: white;
            /* Creates the triangle ramp shape */
            clip-path: polygon(0% 100%, 100% 0%, 100% 100%);
        }

        /* RIDER CONTAINER */
        .rider-unit {
            position: absolute;
            bottom: 100px;
            left: -150px;
            width: 80px;
            height: 200px;
            animation: jumpSequence 5s linear infinite;
        }

        /* Side View EUC Wheel */
        .euc-wheel {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            border: 4px solid white;
            border-radius: 50%;
            background: black;
        }

        .spoke {
            position: absolute;
            top: 50%;
            width: 100%;
            height: 2px;
            background: white;
            animation: spin 0.3s linear infinite;
        }

        /* Single Side Pedal */
        .pedal-side {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 35px;
            height: 6px;
            background: white;
            z-index: 15;
        }

        /* PROFILE RIDER */
        .rider-profile {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 160px;
        }

        /* Single leg in profile */
        .leg {
            position: absolute;
            bottom: 0;
            left: 15px;
            width: 12px;
            height: 70px;
            background: white;
            border-radius: 6px;
        }

        .torso {
            position: absolute;
            bottom: 70px;
            left: 10px;
            width: 20px;
            height: 60px;
            background: white;
            transform: rotate(-10deg); /* Slight forward lean */
            border-radius: 5px;
        }

        /* Single arm in profile */
        .arm {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 8px;
            height: 50px;
            background: white;
            transform: rotate(-30deg);
            border-radius: 4px;
        }

        /* Side view helmet */
        .helmet-side {
            position: absolute;
            top: -45px;
            left: -5px;
            width: 40px;
            height: 40px;
            background: black;
            border: 3px solid white;
            border-radius: 50% 50% 10% 40%;
        }

        .visor-line {
            position: absolute;
            top: 10px;
            right: -2px;
            width: 20px;
            height: 10px;
            background: white;
            border-radius: 0 5px 5px 0;
        }

        /* THE JUMP ANIMATION */
        @keyframes jumpSequence {
            0% { 
                left: -10%; 
                bottom: 100px; 
                transform: rotate(0deg); 
            }
            /* Hits the start of the ramp at 45% of stage */
            35% { 
                left: 37%; 
                bottom: 100px; 
                transform: rotate(0deg); 
            }
            /* Going up the ramp incline */
            42% { 
                left: 45%; 
                bottom: 180px; 
                transform: rotate(-30deg); 
            }
            /* Airborne Arc */
            50% { 
                left: 55%; 
                bottom: 350px; 
                transform: rotate(-10deg); 
            }
            /* Landing */
            58% { 
                left: 65%; 
                bottom: 100px; 
                transform: rotate(15deg); 
            }
            /* Riding away */
            70% { 
                left: 75%; 
                bottom: 100px; 
                transform: rotate(0deg); 
            }
            100% { 
                left: 110%; 
                bottom: 100px; 
                transform: rotate(0deg); 
            }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="clock">00:00:00</div>

    <div class="stage">
        <div class="road-line"></div>
        <div class="ramp"></div>

        <div class="rider-unit">
            <!-- Profile Rider -->
            <div class="rider-profile">
                <div class="leg"></div>
                <div class="torso">
                    <div class="helmet-side">
                        <div class="visor-line"></div>
                    </div>
                    <div class="arm"></div>
                </div>
            </div>

            <!-- Side View EUC -->
            <div class="euc-wheel">
                <div class="spoke"></div>
            </div>
            <div class="pedal-side"></div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('en-GB');
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
