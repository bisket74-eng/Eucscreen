<!DOCTYPE html>
<html>
<head>
    <title>NWEF EUC - Pro Build</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Segoe UI', sans-serif; }

        /* --- GROUNDED FOREST --- */
        .forest-backdrop {
            position: absolute;
            bottom: 20px; /* Locked to road */
            width: 100%; height: 500px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M20 100 L35 20 L50 100 Z M50 100 L65 10 L80 100 Z M0 100 L15 40 L30 100 Z M75 100 L90 30 L100 100 Z" fill="%231a221a"/></svg>');
            background-size: 400px 100%; background-repeat: repeat-x; background-position: bottom;
            z-index: 0; opacity: 0.9;
        }

        /* --- RACING HUD --- */
        #dashboard { position: absolute; top: 5%; display: flex; align-items: center; justify-content: space-between; width: 90%; z-index: 30; }
        
        #clock {
            color: #bc13fe; font-size: 3.5rem; font-weight: 900;
            text-shadow: 0 0 20px #bc13fe, 0 0 40px #bc13fe;
            font-family: monospace; letter-spacing: 2px;
        }

        #nwef {
            font-size: 14rem; font-weight: 900; margin: 0;
            background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff, #ff0000);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: rainbowWave 3s linear infinite;
        }

        #countdown {
            color: #ff9100; font-size: 1.8rem; font-weight: 900;
            text-align: right; text-shadow: 0 0 15px #ff9100;
            line-height: 1.2;
        }

        @keyframes rainbowWave { to { background-position: 200% center; } }

        /* --- STAGE & ROAD --- */
        .stage { position: relative; width: 100%; height: 600px; z-index: 1; }
        .road-line { position: absolute; bottom: 20px; width: 100%; height: 6px; background: #222; z-index: 2; }

        .mound {
            position: absolute; bottom: 20px; width: 450px; height: 35px;
            background: #4e342e; /* Base Dark Brown */
            clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
            left: 35%; z-index: 2;
            /* Spotlight Animation */
            background-image: linear-gradient(to right, transparent, rgba(255,255,200,0.6), transparent);
            background-size: 200px 100%;
            background-repeat: no-repeat;
            background-position: -200px 0;
            animation: spotlightPass 7s linear infinite;
        }

        @keyframes spotlightPass {
            0%, 35% { background-position: -200px 0; }
            40%, 55% { background-position: 500px 0; }
            60%, 100% { background-position: 500px 0; }
        }

        /* --- THE ACTUAL RIDER --- */
        .rider-unit {
            position: absolute; bottom: 20px; left: -250px;
            width: 200px; height: 350px; z-index: 10;
            animation: proJump 7s linear infinite;
        }

        .euc-body {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 110px; height: 130px; z-index: 6;
        }
        .shell { position: absolute; top: 0; left: 20px; width: 70px; height: 85px; background: #222; border-radius: 15px; border-left: 5px solid #ff0000; }
        .tire { position: absolute; bottom: 0; left: 10px; width: 90px; height: 90px; background: #111; border: 5px solid #333; border-radius: 50%; }

        .human {
            position: absolute; bottom: 85px; width: 100%; height: 260px;
            display: flex; flex-direction: column; align-items: center;
            transform: rotate(15deg); transform-origin: bottom center;
            animation: suspensionPhysics 7s linear infinite;
        }

        /* FULL BODY STRUCTURE */
        .leg { position: absolute; bottom: 0; width: 25px; height: 80px; background: #1a1a1a; border-radius: 10px; }
        .boot { position: absolute; bottom: -10px; left: -5px; width: 45px; height: 20px; background: #000; border: 1px solid #444; border-radius: 5px 15px 3px 5px; }
        
        .torso { position: absolute; bottom: 70px; width: 38px; height: 110px; background: #fff; border-radius: 20px; }
        
        /* ARM AT SHOULDER */
        .arm-group { position: absolute; top: 15px; right: -15px; width: 60px; height: 90px; }
        .upper-arm { position: absolute; top: 0; right: 15px; width: 18px; height: 45px; background: #fff; border-radius: 9px; transform: rotate(-5deg); }
        .forearm { position: absolute; top: 30px; right: -15px; width: 16px; height: 50px; background: #fff; border-radius: 8px; transform: rotate(55deg); }
        
        .hand { position: absolute; bottom: -5px; right: -5px; width: 15px; height: 15px; background: #fff; border-radius: 50%; }
        .flashlight { position: absolute; bottom: -8px; right: -25px; width: 28px; height: 12px; background: #333; border-radius: 3px; transform: rotate(-10deg); }
        .light-beam { 
            position: absolute; top: 50%; left: 25px; width: 300px; height: 90px; 
            background: radial-gradient(ellipse at left, rgba(255,255,200,0.4) 0%, transparent 80%); 
            transform: translateY(-50%); 
        }

        .mx-helmet {
            position: absolute; top: -55px; left: 0; width: 50px; height: 45px;
            background: #ff0000; border: 2px solid white; border-radius: 40%;
        }
        .chin-guard { position: absolute; bottom: 0; right: -5px; width: 22px; height: 6px; background: #ff0000; border: 1px solid white; }

        /* --- FENCE --- */
        .pole { position: absolute; bottom: 20px; width: 6px; height: 260px; background: #222; }

        @keyframes proJump {
            0% { left: -25%; bottom: 20px; }
            35% { left: 30%; bottom: 18px; } /* Pre-load */
            40% { left: 45%; bottom: 85px; } 
            50% { left: 55%; bottom: 170px; } 
            60% { left: 85%; bottom: 20px; } 
            100% { left: 115%; bottom: 20px; }
        }

        @keyframes suspensionPhysics {
            0%, 30% { transform: scaleY(1) translateY(0) rotate(15deg); }
            35% { transform: scaleY(0.55) translateY(25px) rotate(15deg); } 
            40%, 55% { transform: scaleY(1.1) translateY(-10px) rotate(15deg); } 
            60% { transform: scaleY(0.6) translateY(30px) rotate(20deg); } 
            66% { transform: scaleY(1) translateY(0) rotate(15deg); }
        }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; fill: #ff0000; } }
    </style>
</head>
<body>

    <div id="dashboard">
        <div id="clock">00:00:00 AM</div>
        <h1 id="nwef">NWEF</h1>
        <div id="countdown">T-MINUS<br>-- DAYS<br>--:--:--</div>
    </div>

    <div class="forest-backdrop"></div>

    <div class="stage">
        <div id="fence-layer"></div>
        <div class="road-line"></div>
        <div class="mound"></div>

        <div class="rider-unit">
            <div class="euc-body">
                <div class="shell"></div>
                <div class="tire">
                    <div style="position:absolute;top:50%;left:50%;width:40px;height:40px;border:4px solid #fff;border-radius:50%;transform:translate(-50%,-50%);">
                        <div style="position:absolute;top:50%;width:100%;height:3px;background:#fff;animation:spin 0.1s linear infinite;"></div>
                    </div>
                </div>
            </div>

            <div class="human">
                <div class="leg">
                    <div class="boot"></div>
                </div>
                <div class="torso">
                    <div class="arm-group">
                        <div class="upper-arm"></div>
                        <div class="forearm">
                            <div class="hand"></div>
                            <div class="flashlight"><div class="light-beam"></div></div>
                        </div>
                    </div>
                    <div class="mx-helmet">
                        <div class="chin-guard"></div>
                        <div style="position:absolute; top:4px; right:-8px; width:12px; height:3px; background:#111;"></div>
                        <div style="position:absolute; top:15px; right:0; width:10px; height:8px; background:#111; border-radius:2px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const targetDate = new Date("July 15, 2026 00:00:00").getTime();
        function updateUI() {
            const now = new Date();
            let h = now.getHours();
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            const clockStr = `${String(h).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')} ${ampm}`;
            document.getElementById('clock').innerText = clockStr;

            const diff = targetDate - now.getTime();
            const d = Math.floor(diff / 864e5), hh = Math.floor((diff % 864e5) / 36e5), mm = Math.floor((diff % 36e5) / 6e4), ss = Math.floor((diff % 6e4) / 1e3);
            document.getElementById('countdown').innerHTML = `T-MINUS<br>${d} DAYS<br>${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
        }
        setInterval(updateUI, 1000); updateUI();

        const layer = document.getElementById('fence-layer'), count = 5, space = window.innerWidth / (count - 1);
        for (let i = 0; i < count; i++) {
            const p = document.createElement('div'); p.className = 'pole'; p.style.left = `${i * space}px`; layer.appendChild(p);
            if (i < count - 1) {
                const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                svg.setAttribute('style', `position:absolute;bottom:280px;left:${i*space}px;width:${space}px;height:100px;overflow:visible;`);
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute('d', `M 0 0 Q ${space/2} 80 ${space} 0`); path.setAttribute('stroke', '#333'); path.setAttribute('fill', 'none'); svg.appendChild(path);
                for (let j = 1; j < 8; j++) {
                    const t = j / 8, bx = t * space, by = (1-t)*(1-t)*0 + 2*(1-t)*t*80 + t*t*0;
                    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    c.setAttribute('cx', bx); c.setAttribute('cy', by); c.setAttribute('r', '3'); c.setAttribute('fill', '#fff');
                    c.style.animation = `twinkle ${1+Math.random()}s infinite`; svg.appendChild(c);
                }
                layer.appendChild(svg);
            }
        }
    </script>
</body>
</html>
